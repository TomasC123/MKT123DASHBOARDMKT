<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads en tiempo real — MKT Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0e0c;
  --panel:rgba(255,255,255,.03);
  --line:rgba(255,255,255,.08);
  --txt:#f7f5f0;
  --mut:rgba(247,245,240,.45);
  --mut2:rgba(247,245,240,.28);
  --alta:#7fd99a;
  --media:#e8c96a;
  --baja:#8fa3b8;
  --desc:#d98880;
}
body{background:var(--bg);color:var(--txt);font-family:'Geist Mono',monospace;font-size:13px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px}

/* ── Header ── */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:30px;line-height:1.1}
.head .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin-top:6px}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stamp{font-size:10px;color:var(--mut2);letter-spacing:.05em;text-align:right}
.btn{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--txt);background:none;border:1px solid var(--line);padding:9px 16px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:rgba(255,255,255,.28)}
.btn:disabled{opacity:.4;cursor:default}

/* ── Filters + summary ── */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:'Geist Mono',monospace;font-size:11px;color:var(--mut);background:none;border:1px solid transparent;padding:6px 12px;cursor:pointer;transition:all .15s;letter-spacing:.03em}
.chip:hover{color:var(--txt)}
.chip.on{color:var(--txt);border-color:var(--line);background:var(--panel)}
.chip.cmp{border-color:var(--line)}
.totals{display:flex;gap:18px;flex-wrap:wrap;font-size:11px}
.totals span{color:var(--mut)}
.totals b{font-weight:500;color:var(--txt);margin-left:5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-alta{background:var(--alta)}.d-media{background:var(--media)}.d-baja{background:var(--baja)}.d-desc{background:var(--desc)}

.secbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:10px;color:var(--mut2);margin:-14px 0 26px;padding-bottom:2px}
.secbar-label{letter-spacing:.08em;text-transform:uppercase;font-size:9px}
.chk.sec{margin-bottom:0;color:var(--mut)}
.chk.sec:hover{color:var(--txt)}

/* ── Alertas ── */
.alerts{margin-bottom:22px}
.alerts-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:1px solid var(--desc);padding:11px 16px;cursor:pointer;font-family:'Geist Mono',monospace;color:var(--desc);font-size:11px;letter-spacing:.04em}
.alerts-toggle:hover{background:rgba(217,136,128,.06)}
.alerts-toggle .n{font-weight:500}
.alerts-list{display:none;border:1px solid var(--line);border-top:none;background:var(--panel)}
.alerts-list.open{display:block}
.alert-item{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05)}
.alert-item:first-child{border-top:none}
.alert-main{flex:1;min-width:0}
.alert-camp{font-size:12px;color:var(--txt);margin-bottom:4px}
.alert-camp .area-tag{margin-right:6px}
.alert-msgs{display:flex;flex-direction:column;gap:3px}
.alert-msg{font-size:11px;color:var(--mut);display:flex;align-items:baseline;gap:6px}
.sev-crit{color:var(--desc)}
.sev-warn{color:var(--media)}
.alert-goto{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--mut2);background:none;border:1px solid var(--line);padding:6px 12px;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:all .15s}
.alert-goto:hover{color:var(--txt);border-color:rgba(255,255,255,.28)}
.alerts-empty{border:1px solid var(--line);background:var(--panel);padding:11px 16px;font-size:11px;color:var(--mut2)}
.card.flagged{border-color:rgba(217,136,128,.4)}
@keyframes flashCard{0%,100%{background:var(--panel)}50%{background:rgba(217,136,128,.1)}}
.card.flash{animation:flashCard .6s ease 2}

/* ── Comparador ── */
.compare{display:none;border:1px solid var(--line);background:var(--panel);padding:18px 20px;margin-bottom:26px}
.compare.open{display:block}
.compare-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.compare-title{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:19px}
.compare-close{background:none;border:none;color:var(--mut);cursor:pointer;font-family:'Geist Mono',monospace;font-size:11px}
.compare-close:hover{color:var(--txt)}
.compare-selects{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.compare-selects label{flex:1;min-width:240px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2)}
.compare-selects select{display:block;width:100%;margin-top:6px;background:#171512;color:var(--txt);border:1px solid var(--line);font-family:'Geist Mono',monospace;font-size:11px;padding:8px 10px}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cmp-side{border:1px solid var(--line);padding:12px 14px}
.cmp-name{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:15px;margin-bottom:2px}
.cmp-sub{font-size:9px;color:var(--mut2);letter-spacing:.06em;margin-bottom:10px}
.cmp-metrics{display:flex;flex-wrap:wrap;gap:12px;font-size:10px;color:var(--mut)}
.cmp-metrics b{display:block;color:var(--txt);font-size:14px;font-weight:500;margin-top:2px}
.cmp-a-mark{display:inline-block;width:14px;height:3px;background:rgba(247,245,240,.9);margin-right:7px;vertical-align:3px}
.cmp-b-mark{display:inline-block;width:14px;height:3px;background:var(--media);margin-right:7px;vertical-align:3px}
.cmp-chart{height:110px;margin-top:4px}
.cmp-chart svg{width:100%;height:100%;display:block}
.cmp-axis{display:flex;justify-content:space-between;font-size:9px;color:var(--mut2);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.compare .hint{font-size:11px;color:var(--mut2);text-align:center;padding:14px 0}

/* ── Cards ── */
.grid{display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);background:var(--panel);padding:18px 20px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.card-check{flex:1}
.chk{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin-bottom:8px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--txt);width:13px;height:13px;cursor:pointer}
.card-title{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:19px;line-height:1.25}
.card-meta{font-size:10px;color:var(--mut2);margin-top:5px;letter-spacing:.04em}
.area-tag{display:inline-block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;margin-right:8px;color:var(--mut);vertical-align:2px}
.card-total{text-align:right;flex-shrink:0}
.card-total .n{font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1}
.card-total .l{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin-top:3px}

.stack{display:flex;height:8px;margin:16px 0 8px;background:rgba(255,255,255,.05)}
.stack div{height:100%}
.s-alta{background:var(--alta)}.s-media{background:var(--media)}.s-baja{background:var(--baja)}.s-desc{background:var(--desc)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--mut)}
.legend b{color:var(--txt);font-weight:500}

.spark-row{display:flex;align-items:flex-end;gap:14px;margin-top:16px}
.spark{flex:1;height:36px}
.spark svg{width:100%;height:100%;display:block}
.spark-label{font-size:9px;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}

.leads-toggle{margin-top:14px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);background:none;border:none;border-top:1px solid var(--line);width:100%;text-align:left;padding:12px 0 0;cursor:pointer;transition:color .15s}
.leads-toggle:hover{color:var(--txt)}
.sect{display:none;margin-top:14px}
.sect.open{display:block}

/* ── Tabla día a día ── */
.daywrap{max-height:320px;overflow-y:auto;border:1px solid var(--line)}
.daytable{width:100%;border-collapse:collapse;font-size:11px}
.daytable th{position:sticky;top:0;background:#171512;text-align:left;font-weight:500;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);padding:9px 12px;border-bottom:1px solid var(--line)}
.daytable td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--mut)}
.daytable td:first-child{color:var(--txt)}
.daytable td.num{text-align:right}
.daytable th.num{text-align:right}
.pos{color:var(--alta)}
.neg{color:var(--desc)}
.flat{color:var(--mut2)}

/* ── Leads list ── */
.lead{border-top:1px solid rgba(255,255,255,.05);padding:12px 0}
.lead:first-child{border-top:none}
.lead-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lead-who b{font-weight:500}
.lead-who span{color:var(--mut);font-size:11px}
.lead-date{font-size:10px;color:var(--mut2);flex-shrink:0}
.badge{display:inline-block;font-size:9px;letter-spacing:.1em;padding:2px 7px;margin-right:8px;vertical-align:1px}
.b-ALTA{color:var(--alta);border:1px solid var(--alta)}
.b-MEDIA{color:var(--media);border:1px solid var(--media)}
.b-BAJA{color:var(--baja);border:1px solid var(--baja)}
.b-DESCARTAR{color:var(--desc);border:1px solid var(--desc)}
.valo{font-size:9px;color:var(--mut2);border:1px solid var(--line);padding:2px 7px;margin-left:8px;letter-spacing:.06em}
.ctx{font-size:11px;color:var(--mut);line-height:1.55;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ctx.open{-webkit-line-clamp:unset}

/* ── States ── */
.state{border:1px solid var(--line);background:var(--panel);padding:26px 20px;text-align:center;color:var(--mut);font-size:12px}
.state.err{color:var(--desc)}
.state small{display:block;margin-top:8px;font-size:10px;color:var(--mut2);line-height:1.6}

/* ── Informes PDF (área de impresión) ── */
#print-area{display:none}
#print-area h1{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:24px;margin-bottom:3px}
#print-area h2{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:16px;margin:18px 0 8px}
#print-area .psub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777;margin-bottom:14px}
#print-area table{width:100%;border-collapse:collapse;font-size:10px;margin:6px 0 12px}
#print-area th,#print-area td{border:1px solid #bbb;padding:5px 8px;text-align:left;vertical-align:top}
#print-area th{background:#f2efe9;font-weight:500;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
#print-area .pnum{text-align:right}
#print-area .pctx{font-size:9px;color:#555;line-height:1.5}
#print-area .firma{display:flex;align-items:center;gap:14px;margin-top:36px;padding-top:16px;border-top:1px solid #ede9e1}
#print-area .firma img{height:26px;width:auto;flex-shrink:0}
#print-area .firma-text{font-size:10px;color:#9a9286;line-height:1.6;border-left:1px solid #ede9e1;padding-left:14px}
#print-area .firma-text .fname{font-size:12px;color:#0f0e0c;font-weight:bold}
#print-area .pbreak{page-break-before:always}
@media print{
  body{background:#fff!important;color:#111!important}
  .wrap{display:none!important}
  #print-area{display:block!important;color:#111;font-family:'Geist Mono',monospace;font-size:11px}
}

@media (max-width:640px){
  .wrap{padding:20px 14px 50px}
  .head h1{font-size:24px}
  .card{padding:14px}
  .card-total .n{font-size:24px}
  .cmp-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>Leads en tiempo real</h1>
      <div class="sub">Calificados por IA · Ingeniería + AGRO</div>
    </div>
    <div class="head-right">
      <div class="stamp" id="stamp">—</div>
      <button class="btn" id="btnInforme" onclick="informeGeneral()">↓ Informe PDF</button>
      <button class="btn" onclick="exportExcel()">↓ Excel</button>
      <button class="btn" id="btnRefresh" onclick="loadAll()">Actualizar</button>
    </div>
  </div>

  <div class="alerts" id="alerts"></div>

  <div class="bar">
    <div class="chips">
      <button class="chip on" data-f="todas" onclick="setFilter('todas',this)">Todas</button>
      <button class="chip" data-f="ing" onclick="setFilter('ing',this)">Ingeniería</button>
      <button class="chip" data-f="agro" onclick="setFilter('agro',this)">AGRO</button>
      <button class="chip cmp" id="chipCmp" onclick="toggleCompare()">⇄ Comparar campañas</button>
      <button class="chip" onclick="selectAll(true)">Marcar todas</button>
      <button class="chip" onclick="selectAll(false)">Desmarcar</button>
    </div>
    <div class="totals" id="totals"></div>
  </div>

  <div class="secbar">
    <span class="secbar-label">Incluir en descargas (PDF / Excel):</span>
    <label class="chk sec"><input type="checkbox" id="secResumen" checked onchange="updateSections()"><span>Resumen y métricas</span></label>
    <label class="chk sec"><input type="checkbox" id="secDias" checked onchange="updateSections()"><span>Día a día</span></label>
    <label class="chk sec"><input type="checkbox" id="secLeads" checked onchange="updateSections()"><span>Detalle de leads (nombres)</span></label>
  </div>

  <div class="compare" id="compare">
    <div class="compare-head">
      <div class="compare-title">Comparar campañas</div>
      <button class="compare-close" onclick="toggleCompare()">✕ Cerrar</button>
    </div>
    <div class="compare-selects">
      <label>Campaña A
        <select id="selA" onchange="renderCompare()"></select>
      </label>
      <label>Campaña B
        <select id="selB" onchange="renderCompare()"></select>
      </label>
    </div>
    <div id="cmp-body"><div class="hint">Elegí dos campañas para compararlas.</div></div>
  </div>

  <div class="grid" id="grid">
    <div class="state">Cargando leads…</div>
  </div>

</div>

<div id="print-area"></div>

<script>
const SOURCES = [
  { id:'ing',  label:'Ingeniería', url:'https://script.google.com/macros/s/AKfycbzU2GRxL87N47Jf0QMMBXy_2xZe98DBP-vbZSYnvXtE92c-4mqX8jveI-jxrogRPolS6g/exec?key=geo2026panel' },
  { id:'agro', label:'AGRO',       url:'https://script.google.com/macros/s/AKfycbyMoVCD8aapFbR4kCgC_G-fQjU5Aye9rR7LZbxPraecsHqGzK02A5n2kdUCqylZcSBw/exec?key=geo2026panel' }
];
const state = { data:{}, filter:'todas', selected:new Set(), sections:{resumen:true, dias:true, leads:true} };
function updateSections(){
  state.sections.resumen = document.getElementById('secResumen').checked;
  state.sections.dias = document.getElementById('secDias').checked;
  state.sections.leads = document.getElementById('secLeads').checked;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtFecha(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtDia(k){
  const p = String(k).split('-');
  return p.length===3 ? p[2]+'/'+p[1] : k;
}
function fmtDiaFull(k){
  const p = String(k).split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : k;
}
function lastDia(porDia){
  const keys = Object.keys(porDia||{}).sort();
  return keys.length ? keys[keys.length-1] : '';
}
function filledSeries(porDia){
  const keys = Object.keys(porDia||{}).sort();
  if (!keys.length) return [];
  const start = new Date(keys[0]+'T00:00:00Z');
  const end = new Date(keys[keys.length-1]+'T00:00:00Z');
  const days = Math.round((end-start)/86400000)+1;
  const out = [];
  for (let d=0; d<days; d++){
    const k = new Date(start.getTime()+d*86400000).toISOString().slice(0,10);
    out.push({ fecha:k, count:porDia[k]||0 });
  }
  return out;
}
// Filas día a día con variación (orden: más reciente arriba)
function dayRows(serie){
  const rows = [];
  for (let i=serie.length-1; i>=0; i--){
    const hoy = serie[i];
    const ayer = i>0 ? serie[i-1] : null;
    let varTxt, cls;
    if (!ayer){ varTxt='—'; cls='flat'; }
    else {
      const d = hoy.count - ayer.count;
      if (d===0){ varTxt='='; cls='flat'; }
      else {
        const sign = d>0 ? '+' : '';
        const pct = ayer.count>0 ? ' ('+sign+Math.round(d/ayer.count*100)+'%)' : '';
        varTxt = sign+d+pct;
        cls = d>0 ? 'pos' : 'neg';
      }
    }
    rows.push({ fecha:hoy.fecha, count:hoy.count, varTxt:varTxt, cls:cls });
  }
  return rows;
}
function campStats(c){
  const serie = filledSeries(c.porDia);
  const p = c.porPrioridad||{};
  const pctAlta = c.total ? Math.round((p.ALTA||0)/c.total*100) : 0;
  const prom = serie.length ? (c.total/serie.length) : 0;
  let best = {fecha:'', count:0};
  serie.forEach(function(s){ if (s.count>best.count) best=s; });
  return {
    serie:serie, pctAlta:pctAlta, prom:prom, best:best,
    first: serie.length?serie[0].fecha:'', last: serie.length?serie[serie.length-1].fecha:'',
    dur: serie.length
  };
}

async function loadAll(){
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true; btn.textContent = 'Actualizando…';
  const results = await Promise.allSettled(SOURCES.map(function(s){
    return fetch(s.url).then(function(r){ return r.json(); });
  }));
  SOURCES.forEach(function(s,i){
    const r = results[i];
    if (r.status === 'fulfilled' && r.value && Array.isArray(r.value.campanas)) {
      state.data[s.id] = { ok:true, payload:r.value };
    } else {
      state.data[s.id] = { ok:false };
    }
  });
  btn.disabled = false; btn.textContent = 'Actualizar';
  const stamps = SOURCES.map(function(s){ return state.data[s.id] && state.data[s.id].ok ? state.data[s.id].payload.actualizado : null; }).filter(Boolean);
  document.getElementById('stamp').textContent = stamps.length ? 'Actualizado ' + fmtFecha(stamps.sort().pop()) : '';
  render();
  renderAlerts();
  populateCompare();
  renderCompare();
}

function setFilter(f, el){
  state.filter = f;
  document.querySelectorAll('.chip[data-f]').forEach(function(c){ c.classList.toggle('on', c===el); });
  render();
}

function allCampanas(){
  const out = [];
  SOURCES.forEach(function(s){
    const d = state.data[s.id];
    if (!d || !d.ok) return;
    d.payload.campanas.forEach(function(c){
      if (!c.total) return;
      out.push(Object.assign({}, c, { _area:s.label, _areaId:s.id }));
    });
  });
  return out;
}
function visibleCampanas(){
  return allCampanas()
    .filter(function(c){ return state.filter==='todas' || state.filter===c._areaId; })
    .sort(function(a,b){ return lastDia(b.porDia).localeCompare(lastDia(a.porDia)); });
}

// ── Alertas automáticas (reglas simples, sin costo de IA) ──
const ALERT_RULES = {
  minLeadsParaAlertar: 5,     // no alertar campañas muy chicas (ruido)
  diasSinActividad: 5,        // "sin actividad" si no hay leads en N días
  caidaVolumenPct: 50,        // "caída" si últimos 7 días <= 50% de los 7 previos
  diasSinAltaReciente: 7,     // ventana para buscar leads ALTA recientes
  pctDescartarAlerta: 40      // "alto descarte" si supera este % del total
};
function slugKey(key){ return 'camp-'+key.replace(/[^a-zA-Z0-9]+/g,'-'); }
function computeAlerts(){
  const hoy = new Date();
  const out = [];
  allCampanas().forEach(function(c){
    if (c.total < ALERT_RULES.minLeadsParaAlertar) return;
    const msgs = [];
    const serie = filledSeries(c.porDia);
    const ult = lastDia(c.porDia);

    // 1) Sin actividad reciente
    if (ult){
      const diasDesde = Math.floor((hoy - new Date(ult+'T00:00:00')) / 86400000);
      if (diasDesde >= ALERT_RULES.diasSinActividad){
        msgs.push({ sev:'warn', text:'Sin nuevos leads hace '+diasDesde+' días' });
      }
    }

    // 2) Caída de volumen (últimos 7 días vs 7 anteriores)
    if (serie.length >= 10){
      const ultimos7 = serie.slice(-7).reduce(function(s,d){return s+d.count;},0);
      const previos7 = serie.slice(-14,-7).reduce(function(s,d){return s+d.count;},0);
      if (previos7 >= 3 && ultimos7 <= previos7 * (ALERT_RULES.caidaVolumenPct/100)){
        const pct = Math.round((1 - ultimos7/previos7) * 100);
        msgs.push({ sev:'crit', text:'Cayó '+pct+'% el volumen (últimos 7 días vs. semana anterior)' });
      }
    }

    // 3) Sin leads ALTA recientes
    const leads = c.ultimosLeads || [];
    const recientes = leads.filter(function(l){
      if (!l.fecha) return false;
      const dias = Math.floor((hoy - new Date(l.fecha)) / 86400000);
      return dias <= ALERT_RULES.diasSinAltaReciente;
    });
    if (recientes.length >= 2 && !recientes.some(function(l){ return l.prioridad==='ALTA'; })){
      msgs.push({ sev:'warn', text:'Ningún lead ALTA en los últimos '+ALERT_RULES.diasSinAltaReciente+' días ('+recientes.length+' leads revisados)' });
    }

    // 4) Alto % de Descartar
    const p = c.porPrioridad||{};
    const pctDesc = c.total ? Math.round((p.DESCARTAR||0)/c.total*100) : 0;
    if (pctDesc >= ALERT_RULES.pctDescartarAlerta){
      msgs.push({ sev:'crit', text: pctDesc+'% de los leads terminaron en Descartar' });
    }

    if (msgs.length) out.push({ campana:c, msgs:msgs });
  });
  // Más críticas primero
  out.sort(function(a,b){
    const critA = a.msgs.filter(function(m){return m.sev==='crit';}).length;
    const critB = b.msgs.filter(function(m){return m.sev==='crit';}).length;
    return critB - critA;
  });
  return out;
}
function goToCard(key){
  const el = document.getElementById(slugKey(key));
  if (!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.add('flash');
  setTimeout(function(){ el.classList.remove('flash'); }, 1300);
}
function toggleAlertsList(){
  const list = document.getElementById('alerts-list');
  const btn = document.getElementById('alerts-toggle-btn');
  list.classList.toggle('open');
  btn.querySelector('.chev').textContent = list.classList.contains('open') ? '▲' : '▼';
}
function renderAlerts(){
  const box = document.getElementById('alerts');
  const items = computeAlerts();
  if (!items.length){
    box.innerHTML = '<div class="alerts-empty">✓ Sin alertas activas — todas las campañas dentro de parámetros normales.</div>';
    return;
  }
  const totalMsgs = items.reduce(function(s,i){return s+i.msgs.length;},0);
  box.innerHTML =
    '<button class="alerts-toggle" id="alerts-toggle-btn" onclick="toggleAlertsList()">'+
      '<span>⚠ '+items.length+' campaña'+(items.length>1?'s':'')+' con alertas <span class="n">('+totalMsgs+')</span></span>'+
      '<span class="chev">▼</span>'+
    '</button>'+
    '<div class="alerts-list" id="alerts-list">'+
      items.map(function(it){
        const c = it.campana;
        return '<div class="alert-item">'+
          '<div class="alert-main">'+
            '<div class="alert-camp"><span class="area-tag">'+esc(c._area)+'</span>'+esc(c.producto)+'</div>'+
            '<div class="alert-msgs">'+it.msgs.map(function(m){
              return '<div class="alert-msg sev-'+m.sev+'">'+(m.sev==='crit'?'●':'○')+' '+esc(m.text)+'</div>';
            }).join('')+'</div>'+
          '</div>'+
          '<button class="alert-goto" onclick="goToCard(\''+esc(campKey(c))+'\')">Ver campaña →</button>'+
        '</div>';
      }).join('')+
    '</div>';
}

    t.total += c.total;

  });
  document.getElementById('totals').innerHTML =

}
function selectAll(on){
  const camps = visibleCampanas();
  if (on) camps.forEach(function(c){ state.selected.add(campKey(c)); });
  else camps.forEach(function(c){ state.selected.delete(campKey(c)); });
  document.querySelectorAll('.chk input[type="checkbox"]').forEach(function(inp){
    inp.checked = state.selected.has(inp.dataset.key);
  });

}
function selectedOrVisible(){
  const camps = visibleCampanas();

  return camps.filter(function(c){ return state.selected.has(campKey(c)); });

function sparkSVG(porDia){
  const serie = filledSeries(porDia);
  if (serie.length < 2) return '<svg viewBox="0 0 100 30" preserveAspectRatio="none"><line x1="0" y1="28" x2="100" y2="28" stroke="rgba(255,255,255,.12)" stroke-width="1"/></svg>';
  const vals = serie.map(function(s){ return s.count; });
  const max = Math.max.apply(null, vals.concat([1]));
  const W=100, H=30, pad=1, n=vals.length;
  const pts = vals.map(function(v,idx){
    const x = (idx/(n-1))*W;
    const y = H-pad - (v/max)*(H-2*pad);
    return x.toFixed(2)+','+y.toFixed(2);
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<polygon points="0,'+H+' '+pts.join(' ')+' '+W+','+H+'" fill="rgba(247,245,240,.06)"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="rgba(247,245,240,.55)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>'+
  '</svg>';
}

  return '<div class="cmp-side">'+
    '<div class="cmp-name"><span class="'+markClass+'"></span>'+esc(c.producto)+'</div>'+

      '<span>Duración<b>'+st.dur+' días</b></span>'+
    '</div>'+
  '</div>';
}
function renderCompare(){
  const body = document.getElementById('cmp-body');
  const a = findCamp(document.getElementById('selA').value);
  const b = findCamp(document.getElementById('selB').value);
  if (!a || !b){
    body.innerHTML = '<div class="hint">Elegí dos campañas para compararlas.</div>';
    return;
  }
  const sA = filledSeries(a.porDia).map(function(s){ return s.count; });
  const sB = filledSeries(b.porDia).map(function(s){ return s.count; });
  const n = Math.max(sA.length, sB.length, 2);
  const max = Math.max.apply(null, sA.concat(sB).concat([1]));
  const W=100, H=40, pad=2;
  function line(vals){
    return vals.map(function(v,idx){
      const x = (idx/(n-1))*W;
      const y = H-pad - (v/max)*(H-2*pad);
      return x.toFixed(2)+','+y.toFixed(2);
    }).join(' ');
  }
  body.innerHTML =
    '<div class="cmp-grid">'+cmpMetrics(a,'cmp-a-mark')+cmpMetrics(b,'cmp-b-mark')+'</div>'+
    '<div class="cmp-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<polyline points="'+line(sA)+'" fill="none" stroke="rgba(247,245,240,.9)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>'+
      '<polyline points="'+line(sB)+'" fill="none" stroke="#e8c96a" stroke-width="1.4" vector-effect="non-scaling-stroke"/>'+
    '</svg></div>'+
    '<div class="cmp-axis"><span>Día 1 de cada campaña</span><span>Leads por día de campaña · Día '+n+'</span></div>'+
    '<div style="margin-top:14px"><button class="btn" onclick="informeComparativa()">↓ Informe comparativo (PDF)</button></div>';
}

function exportExcel(){
  if (typeof XLSX === 'undefined'){ alert('No se pudo cargar la librería de Excel. Revisá la conexión.'); return; }
  const camps = selectedOrVisible();
  if (!camps.length){ alert('No hay datos para exportar.'); return; }
  if (!state.sections.resumen && !state.sections.dias && !state.sections.leads){
    alert('Elegí al menos una sección para descargar (Resumen, Día a día o Detalle de leads).'); return;
  }
  const wb = XLSX.utils.book_new();

  if (state.sections.resumen){
    const resumen = [['Área','Producto','Hoja','Total','ALTA','MEDIA','BAJA','DESCARTAR','Primer día','Último día']];
    camps.forEach(function(c){
      const keys = Object.keys(c.porDia||{}).sort();
      const p = c.porPrioridad||{};
      resumen.push([c._area, c.producto, c.hoja, c.total, p.ALTA||0, p.MEDIA||0, p.BAJA||0, p.DESCARTAR||0, keys[0]||'', keys[keys.length-1]||'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), 'Resumen');
  }

  if (state.sections.dias){
    const diario = [['Fecha','Área','Producto','Hoja','Leads','Variación','Variación %']];
    camps.forEach(function(c){
      const serie = filledSeries(c.porDia);
      serie.forEach(function(s,i){
        const ayer = i>0 ? serie[i-1].count : null;
        const d = ayer===null ? '' : s.count-ayer;
        const pct = (ayer===null||ayer===0) ? '' : Math.round((s.count-ayer)/ayer*100)+'%';
        diario.push([s.fecha, c._area, c.producto, c.hoja, s.count, d, pct]);
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(diario), 'Día a día');
  }

  if (state.sections.leads){
    const hl = [['Fecha','Área','Producto','Nombre','Empresa','Cargo/Rol','Ciudad','Prioridad','Valoración','Contexto IA']];
    camps.forEach(function(c){
      (c.ultimosLeads||[]).forEach(function(l){
        hl.push([l.fecha||'', c._area, c.producto, l.nombre||'', l.empresa||'', l.cargo||l.rol||'', l.ciudad||l.ubicacion||'', l.prioridad||'', l.valoracion||'', l.contexto||'']);
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(hl), 'Últimos leads');
  }

  const hoy = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'leads_'+hoy+'.xlsx');
}

function firmaHTML(){
  let user='', role='';
  try{
    user = sessionStorage.getItem('panel_user')||'';
    role = sessionStorage.getItem('panel_role')||'';
  }catch(e){}
  const rol = role==='admin' ? 'Administrador' : (role==='mkt' ? 'MKT' : (role==='visitor' ? 'Visita' : '—'));
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  const hora = ahora.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  return '<div class="firma">'+
    '<img src="data:image/png;base64,'+LOGO_B64+'">'+
    '<div class="firma-text">'+
      '<div class="fname">'+esc(user||'—')+'</div>'+
      '<div>'+rol+' · Documento generado el '+fecha+' a las '+hora+'</div>'+
      '<div>Dpto. de Comunicación y Marketing</div>'+
    '</div></div>';
}
function doPrint(html){
  document.getElementById('print-area').innerHTML = html;
  setTimeout(function(){ window.print(); }, 600);
}
function metricasTable(c){
  const st = campStats(c);
  const p = c.porPrioridad||{};
  return '<table><thead><tr>'+
    '<th class="pnum">Total</th><th class="pnum">Alta</th><th class="pnum">Media</th><th class="pnum">Baja</th><th class="pnum">Descartar</th>'+
    '<th class="pnum">% Alta</th><th class="pnum">Prom./día</th><th>Mejor día</th><th>Período</th></tr></thead>'+
    '<tbody><tr>'+
    '<td class="pnum">'+c.total+'</td>'+
    '<td class="pnum">'+(p.ALTA||0)+'</td>'+
    '<td class="pnum">'+(p.MEDIA||0)+'</td>'+
    '<td class="pnum">'+(p.BAJA||0)+'</td>'+
    '<td class="pnum">'+(p.DESCARTAR||0)+'</td>'+
    '<td class="pnum">'+st.pctAlta+'%</td>'+
    '<td class="pnum">'+st.prom.toFixed(1)+'</td>'+
    '<td>'+st.best.count+' leads ('+fmtDiaFull(st.best.fecha)+')</td>'+
    '<td>'+fmtDiaFull(st.first)+' – '+fmtDiaFull(st.last)+' ('+st.dur+' días)</td>'+
    '</tr></tbody></table>';
}
function diaTablePrint(c){
  const rows = dayRows(filledSeries(c.porDia));
  return '<table><thead><tr><th>Fecha</th><th class="pnum">Leads</th><th class="pnum">Variación vs día anterior</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td>'+fmtDiaFull(r.fecha)+'</td><td class="pnum">'+r.count+'</td><td class="pnum">'+r.varTxt+'</td></tr>';
    }).join('')+'</tbody></table>';
}
function leadsTablePrint(c){
  const leads = c.ultimosLeads||[];
  if (!leads.length) return '';
  return '<h2>Últimos leads</h2><table><thead><tr><th>Fecha</th><th>Nombre</th><th>Empresa</th><th>Cargo/Rol</th><th>Ubicación</th><th>Prioridad</th><th>Contexto IA</th></tr></thead><tbody>'+
    leads.map(function(l){
      return '<tr><td>'+fmtFecha(l.fecha)+'</td><td>'+esc(l.nombre)+'</td><td>'+esc(l.empresa)+'</td><td>'+esc(l.cargo||l.rol||'')+'</td><td>'+esc(l.ciudad||l.ubicacion||'')+'</td><td>'+esc(l.prioridad)+'</td><td class="pctx">'+esc(l.contexto||'')+'</td></tr>';
    }).join('')+'</tbody></table>';
}
function seccionCampana(c){
  let out = '<h2>'+esc(c.producto)+' <span style="font-size:10px;color:#777">('+esc(c._area)+' · '+esc(c.hoja)+')</span></h2>';
  if (state.sections.resumen) out += metricasTable(c);
  if (state.sections.dias) out += '<h2 style="font-size:13px">Día a día</h2>'+diaTablePrint(c);
  if (state.sections.leads) out += leadsTablePrint(c);
  return out;
}
function informeCampanaBtn(btn){
  const c = findCamp(btn.dataset.key);
  if (!c) return;
  let body = '<h1>Informe de campaña — '+esc(c.producto)+'</h1>'+
    '<div class="psub">'+esc(c._area)+' · '+esc(c.hoja)+'</div>';
  if (state.sections.resumen) body += metricasTable(c);
  if (state.sections.dias) body += '<h2>Día a día</h2>'+diaTablePrint(c);
  if (state.sections.leads) body += leadsTablePrint(c);
  doPrint(body + firmaHTML());
}
function informeComparativa(){
  const a = findCamp(document.getElementById('selA').value);
  const b = findCamp(document.getElementById('selB').value);
  if (!a || !b){ alert('Elegí las dos campañas primero.'); return; }
  const stA = campStats(a), stB = campStats(b);
  const pA = a.porPrioridad||{}, pB = b.porPrioridad||{};
  const n = Math.max(stA.serie.length, stB.serie.length);
  let filas = '';
  for (let i=0; i<n; i++){
    const vA = i<stA.serie.length ? stA.serie[i].count : '';
    const vB = i<stB.serie.length ? stB.serie[i].count : '';
    filas += '<tr><td>Día '+(i+1)+'</td><td class="pnum">'+vA+'</td><td class="pnum">'+vB+'</td></tr>';
  }
  function row(nom, va, vb){ return '<tr><td>'+nom+'</td><td class="pnum">'+va+'</td><td class="pnum">'+vb+'</td></tr>'; }
  let body = '<h1>Informe comparativo de campañas</h1>'+
    '<div class="psub">A: '+esc(a.producto)+' ('+esc(a._area)+') &nbsp;·&nbsp; B: '+esc(b.producto)+' ('+esc(b._area)+')</div>';
  if (state.sections.resumen){
    body += '<table><thead><tr><th>Métrica</th><th class="pnum">A — '+esc(a.producto)+'</th><th class="pnum">B — '+esc(b.producto)+'</th></tr></thead><tbody>'+
      row('Total de leads', a.total, b.total)+
      row('Alta', (pA.ALTA||0)+' ('+stA.pctAlta+'%)', (pB.ALTA||0)+' ('+stB.pctAlta+'%)')+
      row('Media', pA.MEDIA||0, pB.MEDIA||0)+
      row('Baja', pA.BAJA||0, pB.BAJA||0)+
      row('Descartar', pA.DESCARTAR||0, pB.DESCARTAR||0)+
      row('Promedio leads/día', stA.prom.toFixed(1), stB.prom.toFixed(1))+
      row('Mejor día', stA.best.count+' ('+fmtDiaFull(stA.best.fecha)+')', stB.best.count+' ('+fmtDiaFull(stB.best.fecha)+')')+
      row('Duración', stA.dur+' días', stB.dur+' días')+
      row('Período', fmtDiaFull(stA.first)+' – '+fmtDiaFull(stA.last), fmtDiaFull(stB.first)+' – '+fmtDiaFull(stB.last))+
    '</tbody></table>';
  }
  if (state.sections.dias){
    body += '<h2>Leads por día de campaña (día 1 = inicio de cada una)</h2>'+
    '<table><thead><tr><th>Día de campaña</th><th class="pnum">A — '+esc(a.producto)+'</th><th class="pnum">B — '+esc(b.producto)+'</th></tr></thead><tbody>'+filas+'</tbody></table>';
  }
  doPrint(body + firmaHTML());
}
function informeGeneral(){
  const camps = selectedOrVisible();
  if (!camps.length){ alert('No hay datos para el informe.'); return; }
  if (!state.sections.resumen && !state.sections.dias && !state.sections.leads){
    alert('Elegí al menos una sección para el informe (Resumen, Día a día o Detalle de leads).'); return;
  }
  const nombreFiltro = state.selected.size
    ? camps.length+' campaña'+(camps.length>1?'s':'')+' seleccionada'+(camps.length>1?'s':'')
    : (state.filter==='todas' ? 'Todas las áreas' : (state.filter==='ing' ? 'Ingeniería' : 'AGRO'));
  const t = { total:0, ALTA:0, MEDIA:0, BAJA:0, DESCARTAR:0 };
  camps.forEach(function(c){
    t.total += c.total;
    ['ALTA','MEDIA','BAJA','DESCARTAR'].forEach(function(k){ t[k] += (c.porPrioridad && c.porPrioridad[k])||0; });
  });
  let resumen = '';
  if (state.sections.resumen){
    resumen = '<table><thead><tr><th>Área</th><th>Producto</th><th>Hoja</th><th class="pnum">Total</th><th class="pnum">Alta</th><th class="pnum">Media</th><th class="pnum">Baja</th><th class="pnum">Desc.</th><th class="pnum">% Alta</th><th>Período</th></tr></thead><tbody>';
    camps.forEach(function(c){
      const st = campStats(c);
      const p = c.porPrioridad||{};
      resumen += '<tr><td>'+esc(c._area)+'</td><td>'+esc(c.producto)+'</td><td>'+esc(c.hoja)+'</td>'+
        '<td class="pnum">'+c.total+'</td><td class="pnum">'+(p.ALTA||0)+'</td><td class="pnum">'+(p.MEDIA||0)+'</td><td class="pnum">'+(p.BAJA||0)+'</td><td class="pnum">'+(p.DESCARTAR||0)+'</td>'+
        '<td class="pnum">'+st.pctAlta+'%</td><td>'+fmtDiaFull(st.first)+' – '+fmtDiaFull(st.last)+'</td></tr>';
    });
    resumen += '<tr><td colspan="3"><b>TOTAL</b></td><td class="pnum"><b>'+t.total+'</b></td><td class="pnum"><b>'+t.ALTA+'</b></td><td class="pnum"><b>'+t.MEDIA+'</b></td><td class="pnum"><b>'+t.BAJA+'</b></td><td class="pnum"><b>'+t.DESCARTAR+'</b></td><td class="pnum"></td><td></td></tr></tbody></table>';
  }

  const secciones = camps.map(function(c,i){
    return '<div'+(i>0?' class="pbreak"':'')+'>'+seccionCampana(c)+'</div>';
  }).join('');

  let body = '<h1>Informe de leads en tiempo real</h1>'+
    '<div class="psub">'+nombreFiltro+' · '+camps.length+' campañas · '+t.total+' leads</div>';
  if (resumen) body += '<h2>Resumen general</h2>'+resumen;
  if (secciones.trim()) body += '<div class="pbreak"></div><h2 style="font-size:18px">Detalle por campaña</h2>'+secciones;
  doPrint(body + firmaHTML());
}

loadAll();
</script>
</body>
</html>
