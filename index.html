<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKT Panel de Control</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0e0c;font-family:'Geist Mono',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:0;padding:0;background:#0f0e0c;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.logo{padding:16px 28px;border-right:1px solid rgba(255,255,255,.08);cursor:pointer}
.logo-title{font-family:'Instrument Serif',Georgia,serif;font-size:18px;font-style:italic;color:#f7f5f0;display:block;line-height:1}
.logo-sub{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,245,240,.3)}
.tabs{display:flex;flex:1}
.tab{padding:0 28px;height:54px;display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(247,245,240,.45);cursor:pointer;border:none;background:none;font-family:'Geist Mono',monospace;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.02em}
.tab:hover{color:rgba(247,245,240,.75)}
.tab.active{color:#f7f5f0;border-bottom-color:#f7f5f0;font-weight:500}
.tab-icon{font-size:14px}
.role-badge{margin-left:auto;margin-right:20px;font-size:10px;color:rgba(247,245,240,.4);display:flex;align-items:center;gap:8px}
.role-pill{padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.logout-btn{background:none;border:none;color:rgba(247,245,240,.4);cursor:pointer;font-family:'Geist Mono',monospace;font-size:10px;text-decoration:underline}
.logout-btn:hover{color:rgba(247,245,240,.8)}
.frame-wrap{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none}
iframe.active{display:block}
.logs-page{position:absolute;inset:0;display:none;overflow-y:auto;background:#f7f5f0;padding:32px 36px}
.logs-page.active{display:block}
.logs-title{font-family:'Instrument Serif',Georgia,serif;font-size:32px;font-style:italic;color:#0f0e0c;margin-bottom:24px}
.logs-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid #ddd8ce;border-radius:12px;overflow:hidden}
.logs-table th{padding:9px 13px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#9a9286;border-bottom:1px solid #ddd8ce;background:#ede9e1;font-weight:500}
.logs-table td{padding:9px 13px;border-bottom:1px solid #ddd8ce;color:#0f0e0c}
.logs-table tr:last-child td{border-bottom:none}
.logs-empty{padding:60px 20px;text-align:center;color:#c4bfb5;font-size:12px}
.logs-refresh{padding:8px 14px;border-radius:6px;border:1px solid #ccc6ba;background:#fff;color:#0f0e0c;font-family:'Geist Mono',monospace;font-size:11px;cursor:pointer;margin-bottom:16px}
.logs-refresh:hover{background:#ede9e1}
.role-tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;font-weight:500}
.role-tag.mkt{background:#eef3fc;color:#1a4fa8;border:1px solid #c5d7f7}
.role-tag.visitor{background:#fdf8ec;color:#8a6500;border:1px solid #f0dfa0}

/* INFORME IA */
.informe-page{position:absolute;inset:0;display:none;overflow-y:auto;background:#f7f5f0;padding:32px 36px}
.informe-page.active{display:block}
.informe-intro{max-width:640px;margin:60px auto;text-align:center}
.informe-btn{padding:14px 28px;border-radius:8px;border:none;background:#0f0e0c;color:#f7f5f0;font-family:'Geist Mono',monospace;font-size:13px;cursor:pointer;letter-spacing:.04em}
.informe-btn:hover{opacity:.85}
.informe-loading{text-align:center;padding:100px 20px;color:#9a9286;font-size:13px}
.informe-doc{max-width:820px;margin:0 auto}
.informe-header{text-align:center;margin-bottom:32px;padding-bottom:20px;border-bottom:2px solid #0f0e0c}
.informe-title{font-family:'Instrument Serif',Georgia,serif;font-size:36px;font-style:italic;color:#0f0e0c}
.informe-date{font-size:11px;color:#9a9286;margin-top:6px}
.informe-section{margin-bottom:32px;page-break-inside:avoid}
.informe-section-title{font-family:'Instrument Serif',Georgia,serif;font-size:20px;font-style:italic;color:#0f0e0c;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #ddd8ce}
.informe-section-body{font-size:13px;color:#2a2420;line-height:1.8}
.informe-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.informe-kpi{background:#fff;border:1px solid #ddd8ce;border-radius:8px;padding:12px 14px}
.informe-kpi-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#9a9286;margin-bottom:4px}
.informe-kpi-val{font-family:'Instrument Serif',Georgia,serif;font-size:22px;color:#0f0e0c}
.informe-actions{display:flex;gap:8px;justify-content:center;margin:24px 0}
@media print{.informe-actions,.topbar{display:none!important}.informe-page{padding:0}}

/* LOGIN SCREEN */
.login-screen{position:fixed;inset:0;background:#0f0e0c;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#f7f5f0;border-radius:12px;padding:40px 48px;width:100%;max-width:400px;text-align:center}
.login-logo{font-family:'Instrument Serif',Georgia,serif;font-size:32px;font-style:italic;color:#0f0e0c;margin-bottom:4px}
.login-sub{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#c4bfb5;margin-bottom:32px}
.profile-btn{display:block;width:100%;padding:13px 16px;margin-bottom:8px;border-radius:8px;border:1px solid #ccc6ba;background:#fff;color:#0f0e0c;font-family:'Geist Mono',monospace;font-size:13px;cursor:pointer;text-align:left;transition:all .15s}
.profile-btn:hover{border-color:#0f0e0c;background:#ede9e1}
.login-field{width:100%;padding:10px 14px;border:1px solid #ccc6ba;border-radius:6px;font-family:'Geist Mono',monospace;font-size:14px;background:#fff;color:#0f0e0c;outline:none;text-align:center;letter-spacing:.1em;margin-bottom:10px}
.login-field:focus{border-color:#0f0e0c}
.login-btn{width:100%;padding:11px;border-radius:6px;border:none;background:#0f0e0c;color:#f7f5f0;font-family:'Geist Mono',monospace;font-size:12px;cursor:pointer;margin-bottom:8px;letter-spacing:.04em}
.login-btn:hover{opacity:.85}
.login-back{background:none;border:none;color:#9a9286;font-family:'Geist Mono',monospace;font-size:10px;cursor:pointer;text-decoration:underline;margin-bottom:16px}
.login-err{font-size:11px;color:#c0392b;min-height:18px;margin-top:4px}
.chosen-name{font-family:'Instrument Serif',Georgia,serif;font-size:20px;font-style:italic;color:#0f0e0c;margin-bottom:18px}

/* HOME MENU */
.home-screen{position:fixed;inset:0;background:#f7f5f0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:24px}
.home-screen.active{display:flex}
.home-title{font-family:'Instrument Serif',Georgia,serif;font-size:34px;font-style:italic;color:#0f0e0c}
.home-sub{font-size:11px;color:#9a9286;margin-bottom:8px}
.home-tiles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:700px}
.home-tile{background:#fff;border:1px solid #ddd8ce;border-radius:14px;padding:32px 40px;width:200px;text-align:center;cursor:pointer;transition:all .15s;font-family:'Geist Mono',monospace}
.home-tile:hover{border-color:#0f0e0c;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.home-tile-icon{font-size:30px;margin-bottom:10px;display:block}
.home-tile-label{font-size:13px;color:#0f0e0c;font-weight:500}
.home-tile-sub{font-size:9px;color:#9a9286;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.home-logout{margin-top:10px;background:none;border:none;color:#9a9286;font-family:'Geist Mono',monospace;font-size:10px;cursor:pointer;text-decoration:underline}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">MKT</div>
    <div class="login-sub">Panel de Control</div>

    <div id="step-profiles">
      <div id="profiles-list"></div>
    </div>

    <div id="step-password" style="display:none">
      <div class="chosen-name" id="chosen-name-label"></div>
      <input class="login-field" type="password" id="login-pwd" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="login-btn" onclick="doLogin()">Ingresar</button>
      <button class="login-back" onclick="backToProfiles()">← Elegir otro perfil</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>
</div>

<!-- HOME MENU -->
<div class="home-screen" id="home-screen">
  <div class="home-title">MKT</div>
  <div class="home-sub" id="home-welcome"></div>
  <div class="home-tiles" id="home-tiles"></div>
  <button class="home-logout" onclick="doLogout()">Cerrar sesión</button>
</div>

<div id="app" style="display:none;flex-direction:column;height:100vh">
  <div class="topbar">
    <div class="logo" onclick="goHome()">
      <span class="logo-title">MKT</span>
      <span class="logo-sub">Panel de Control</span>
    </div>
    <div class="tabs">
      <button class="tab" onclick="switchTab('calendario')" id="tab-calendario">
        <span class="tab-icon">◫</span> Calendario
      </button>
      <button class="tab" onclick="switchTab('campanas')" id="tab-campanas">
        <span class="tab-icon">◈</span> Campañas
      </button>

    </div>
    <div class="role-badge">
      <span class="role-pill" id="role-pill">—</span>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="frame-wrap">
    <iframe id="frame-calendario"></iframe>
    <iframe id="frame-campanas"></iframe>
    <div class="logs-page" id="logs-page">
      <h1 class="logs-title">Logs de actividad</h1>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="logs-refresh" style="margin-bottom:0" onclick="loadLogs()">↺ Recargar</button>
        <button class="logs-refresh" style="margin-bottom:0" onclick="exportLogsExcel()">↓ Descargar Excel</button>
      </div>
      <div id="logs-content"></div>
    </div>
    <div class="informe-page" id="informe-page">
      <div class="informe-intro" id="informe-intro">
        <div class="informe-title" style="margin-bottom:10px">Informe ejecutivo completo</div>
        <p style="font-size:12px;color:#9a9286;margin-bottom:28px;line-height:1.7">
          Analiza campañas, mailings, ventas, presupuesto planificado y actividad del equipo en un solo informe.
          Usa Claude Fable para el análisis narrativo, con datos y gráficos calculados en tiempo real.
        </p>
        <button class="informe-btn" onclick="generarInforme()">✦ Generar informe completo</button>
      </div>
      <div id="informe-body"></div>
    </div>
  </div>
</div>

<script>
const API_KEY='$2a$10$8zdRepF9eXqIWoAegLw22uCbihfDgvF2UO1kanxuRU8a.JZ2.uyDW';
const CAMPANAS_BIN='6a0604f4adc21f119a9e13b5';

var PROFILES=[
  {name:'Victoria Scarpettini',hash:'e39e82d0c063a44d845d1d3a6c610f2cf2d8f583b37de02e34e143adca8f585b',role:'mkt'},
  {name:'Valentina Maroño Ferrer',hash:'b3fd42514ae4733d141b3e767b78fde0e3828f483788460ff85fc5a441ba98cf',role:'mkt'},
  {name:'Tomás Coppede',hash:'63d0504d1132b7cbff51d6253504430ba72f85ec2f2e2ab2fa1169f102f30d48',role:'admin'},
  {name:'Visita',hash:'fb113b4df80f8277df97fdbd31ebdbafea1847ae010c54d31db9da40a2964b04',role:'visitor'}
];

var chosenProfile=null;
var loadedFrames={};

function sha256(str){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
    .then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
}

// ── LOGIN: STEP 1 — elegir perfil ─────────────────────
function renderProfileList(){
  document.getElementById('profiles-list').innerHTML=PROFILES.map(function(p,i){
    return '<button class="profile-btn" data-i="'+i+'" onclick="selectProfile('+i+')">'+p.name+'</button>';
  }).join('');
}
renderProfileList();

function selectProfile(i){
  chosenProfile=PROFILES[i];
  document.getElementById('step-profiles').style.display='none';
  document.getElementById('step-password').style.display='block';
  document.getElementById('chosen-name-label').textContent=chosenProfile.name;
  document.getElementById('login-pwd').value='';
  document.getElementById('login-err').textContent='';
  document.getElementById('login-pwd').focus();
}
function backToProfiles(){
  chosenProfile=null;
  document.getElementById('step-password').style.display='none';
  document.getElementById('step-profiles').style.display='block';
}

// ── LOGIN: STEP 2 — contraseña ────────────────────────
function doLogin(){
  if(!chosenProfile)return;
  var pwd=document.getElementById('login-pwd').value;
  sha256(pwd).then(function(hash){
    if(hash===chosenProfile.hash){
      sessionStorage.setItem('panel_role',chosenProfile.role);
      sessionStorage.setItem('panel_user',chosenProfile.name);
      logActivity(chosenProfile.role,chosenProfile.name,'login','Inicio de sesión');
      goHome();
    }else{
      document.getElementById('login-err').textContent='Contraseña incorrecta';
      document.getElementById('login-pwd').value='';
    }
  });
}

function doLogout(){
  var role=sessionStorage.getItem('panel_role');
  var user=sessionStorage.getItem('panel_user');
  logActivity(role,user,'logout','Cierre de sesión');
  sessionStorage.removeItem('panel_role');
  sessionStorage.removeItem('panel_user');
  location.reload();
}

// ── HOME MENU (después de loguearse) ──────────────────
function goHome(){
  var role=sessionStorage.getItem('panel_role');
  var user=sessionStorage.getItem('panel_user');
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='none';
  document.getElementById('home-screen').classList.add('active');
  document.getElementById('home-welcome').textContent=user?('Hola, '+user):'';

  var tiles=[
    {id:'calendario',icon:'◫',label:'Calendario',sub:'Planificación mensual'},
    {id:'campanas',icon:'◈',label:'Campañas',sub:'Gestión y resultados'}
  ];
  if(role==='admin'){
    tiles.push({id:'logs',icon:'☰',label:'Logs',sub:'Actividad del equipo'});
    tiles.push({id:'informe',icon:'✦',label:'Informe IA',sub:'Análisis ejecutivo completo'});
  }

  document.getElementById('home-tiles').innerHTML=tiles.map(function(t){
    return '<div class="home-tile" data-tab="'+t.id+'" onclick="enterApp(this.dataset.tab)">'
      +'<span class="home-tile-icon">'+t.icon+'</span>'
      +'<div class="home-tile-label">'+t.label+'</div>'
      +'<div class="home-tile-sub">'+t.sub+'</div>'
      +'</div>';
  }).join('');

  var pill=document.getElementById('role-pill');
  if(role==='admin')pill.textContent=(user||'')+' · Admin';
  else if(role==='mkt')pill.textContent=(user||'')+' · MKT';
  else pill.textContent=(user||'')+' · solo lectura';


}

function enterApp(tabName){
  document.getElementById('home-screen').classList.remove('active');
  document.getElementById('app').style.display='flex';
  switchTab(tabName);
}

// Al tocar el logo, volver al menú de inicio
function goHomeFromApp(){
  document.getElementById('app').style.display='none';
  goHome();
}
// sobreescribimos goHome usado por el logo para no perder sesión — usamos goHomeFromApp en el click del logo
document.querySelector('.logo').setAttribute('onclick','goHomeFromApp()');

// ── Restaurar sesión activa (recarga de página) ───────
(function(){
  var saved=sessionStorage.getItem('panel_role');
  if(saved==='mkt'||saved==='visitor'||saved==='admin'){
    goHome();
  }
})();

// ── TABS (carga perezosa de iframes) ──────────────────
function switchTab(name){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('iframe').forEach(function(f){f.classList.remove('active');});
  document.getElementById('logs-page').classList.remove('active');
  document.getElementById('tab-'+name).classList.add('active');

  if(name==='logs'){
    document.getElementById('logs-page').classList.add('active');
    loadLogs();
  }else if(name==='informe'){
    document.getElementById('informe-page').classList.add('active');
  }else{
    var frame=document.getElementById('frame-'+name);
    if(!loadedFrames[name]){
      frame.src=name+'.html';
      loadedFrames[name]=true;
    }
    frame.classList.add('active');
  }
  var role=sessionStorage.getItem('panel_role');
  var user=sessionStorage.getItem('panel_user');
  logActivity(role,user,'nav','Navegó a '+name);
}

// ── LOGGING ───────────────────────────────────────────
async function logActivity(role,user,action,detail){
  try{
    var r=await fetch('https://api.jsonbin.io/v3/b/'+CAMPANAS_BIN+'/latest',{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok)return;
    var rec=(await r.json()).record||{};
    var logs=rec.logs||[];
    logs.push({ts:new Date().toISOString(),role:role||'—',user:user||'—',page:'index',action:action,detail:detail||''});
    if(logs.length>300)logs=logs.slice(logs.length-300);
    rec.logs=logs;
    await fetch('https://api.jsonbin.io/v3/b/'+CAMPANAS_BIN,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(rec)});
  }catch(e){console.error('log error',e);}
}

async function loadLogs(){
  var el=document.getElementById('logs-content');
  el.innerHTML='<p style="font-size:12px;color:#9a9286">Cargando...</p>';
  try{
    var r=await fetch('https://api.jsonbin.io/v3/b/'+CAMPANAS_BIN+'/latest',{headers:{'X-Master-Key':API_KEY}});
    var rec=(await r.json()).record||{};
    var logs=(rec.logs||[]).slice().reverse();
    if(!logs.length){el.innerHTML='<div class="logs-empty">Sin actividad registrada todavía.</div>';return;}
    el.innerHTML='<table class="logs-table"><thead><tr><th>Fecha / Hora</th><th>Usuario</th><th>Perfil</th><th>Página</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>'
      +logs.map(function(l){
        var d=new Date(l.ts);
        var fecha=d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
        var roleClass=(l.role==='admin'||l.role==='mkt')?'mkt':'visitor';
        return '<tr><td style="color:#9a9286;font-size:11px">'+fecha+'</td>'
          +'<td>'+(l.user||'—')+'</td>'
          +'<td><span class="role-tag '+roleClass+'">'+(l.role||'—')+'</span></td>'
          +'<td>'+(l.page||'—')+'</td>'
          +'<td>'+l.action+'</td>'
          +'<td style="color:#9a9286;font-size:11px">'+(l.detail||'')+'</td></tr>';
      }).join('')
      +'</tbody></table>';
  }catch(e){
    el.innerHTML='<div class="logs-empty">Error al cargar logs.</div>';
  }
}

async function exportLogsExcel(){
  try{
    var r=await fetch('https://api.jsonbin.io/v3/b/'+CAMPANAS_BIN+'/latest',{headers:{'X-Master-Key':API_KEY}});
    var rec=(await r.json()).record||{};
    var logs=(rec.logs||[]).slice().reverse();
    if(!logs.length){alert('No hay actividad registrada para exportar.');return;}

    var rows=[['Fecha','Hora','Usuario','Perfil','Página','Acción','Detalle']];
    logs.forEach(function(l){
      var d=new Date(l.ts);
      rows.push([
        d.toLocaleDateString('es-AR'),
        d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),
        l.user||'—',
        l.role||'—',
        l.page||'—',
        l.action||'—',
        l.detail||''
      ]);
    });

    var wb=XLSX.utils.book_new();
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:8},{wch:24},{wch:10},{wch:12},{wch:16},{wch:40}];
    XLSX.utils.book_append_sheet(wb,ws,'Logs');
    XLSX.writeFile(wb,'Logs_MKT_'+new Date().toISOString().slice(0,10)+'.xlsx');

    var role=sessionStorage.getItem('panel_role');
    var user=sessionStorage.getItem('panel_user');
    logActivity(role,user,'export_logs','Descargó reporte de logs');
  }catch(e){
    alert('Error al generar el reporte.');
    console.error(e);
  }
}

// ── INFORME IA COMPLETO (solo Admin) ──────────────────
const CAL_BIN='69e68df036566621a8d3ca66';

function fmtM(n){return n!=null?'$'+Math.round(n).toLocaleString():'—';}
function pctM(n){return n!=null?Math.round(n)+'%':'—';}

async function generarInforme(){
  var intro=document.getElementById('informe-intro');
  var body=document.getElementById('informe-body');
  intro.style.display='none';
  body.innerHTML='<div class="informe-loading">✦ Reuniendo datos de campañas, mailings, ventas y logs...<br><span style="font-size:11px">Esto puede tardar unos segundos</span></div>';

  try{
    var r1=await fetch('https://api.jsonbin.io/v3/b/'+CAMPANAS_BIN+'/latest',{headers:{'X-Master-Key':API_KEY}});
    var rec1=(await r1.json()).record||{};
    var campaigns=rec1.campaigns||[];
    var mailings=rec1.mailings||[];
    var ventas=rec1.ventas||[];
    var logs=rec1.logs||[];
    var products=rec1.products||[];

    function pName(id){var p=products.find(function(x){return x.id===id;});return p?p.name:id||'—';}
    function pArea(id){var p=products.find(function(x){return x.id===id;});return p?p.area:'—';}

    // ── AGGREGATE FINANCIAL DATA ──
    var activeCamps=campaigns.filter(function(c){return !c.cancelada;});
    var totBud=0,totEff=0,totLeads=0,totWpp=0;
    var byArea={},byMonth={};
    activeCamps.forEach(function(c){
      if(c.budTotal)totBud+=c.budTotal;
      if(c.effTotal)totEff+=c.effTotal;
      if(!c.sinLeads&&c.leads)totLeads+=c.leads;
      if(!c.sinLeads&&c.wpp)totWpp+=c.wpp;
      var a=pArea(c.producto)||'Otros';
      if(!byArea[a])byArea[a]={bud:0,eff:0,leads:0,wpp:0,count:0};
      byArea[a].count++;
      if(c.effTotal)byArea[a].eff+=c.effTotal;
      if(c.budTotal)byArea[a].bud+=c.budTotal;
      if(c.leads)byArea[a].leads+=c.leads;
      if(c.wpp)byArea[a].wpp+=c.wpp;
      var mk=c.anio+'-'+String(c.mes).padStart(2,'0');
      if(!byMonth[mk])byMonth[mk]={label:mk,bud:0,eff:0,leads:0};
      if(c.budTotal)byMonth[mk].bud+=c.budTotal;
      if(c.effTotal)byMonth[mk].eff+=c.effTotal;
      if(c.leads)byMonth[mk].leads+=c.leads;
    });
    var canceladas=campaigns.filter(function(c){return c.cancelada;});

    // ── MAILINGS ──
    var totEnv=0,totAp=0,totCl=0,totMailCost=0;
    mailings.forEach(function(m){
      if(m.enviados)totEnv+=m.enviados;
      if(m.aperturas)totAp+=m.aperturas;
      if(m.clicks)totCl+=m.clicks;
      if(m.costo)totMailCost+=m.costo;
    });
    var avgApertura=totEnv?Math.round(totAp/totEnv*100):null;
    var avgCTR=totEnv?Math.round(totCl/totEnv*100):null;

    // ── VENTAS / ROI ──
    var totFactura=0,totInvVinculada=0;
    var byProdVentas={};
    ventas.forEach(function(v){
      if(v.monto)totFactura+=v.monto;
      var camp=v.campanaId?campaigns.find(function(c){return c.id===v.campanaId;}):null;
      if(camp&&camp.effTotal)totInvVinculada+=camp.effTotal;
      var pn=pName(v.producto)||'—';
      if(!byProdVentas[pn])byProdVentas[pn]={monto:0,count:0};
      byProdVentas[pn].count++;
      if(v.monto)byProdVentas[pn].monto+=v.monto;
    });
    var roiTotal=totInvVinculada?Math.round((totFactura-totInvVinculada)/totInvVinculada*100):null;

    // ── LOGS / ACTIVIDAD ──
    var byUser={};
    logs.forEach(function(l){
      var u=l.user||'—';
      if(!byUser[u])byUser[u]=0;
      byUser[u]++;
    });

    // ── PRESUPUESTO PLANIFICADO (calendario) ──
    var r2=await fetch('https://api.jsonbin.io/v3/b/'+CAL_BIN+'/latest',{headers:{'X-Master-Key':API_KEY}});
    var rec2=(await r2.json()).record||{};
    var calendars=rec2.calendars||{};
    var totalPlanificado=0;
    Object.values(calendars).forEach(function(cal){
      var cells=cal.cells||{};
      Object.keys(cells).forEach(function(){totalPlanificado++;});
    });

    // ── BUILD PROMPT FOR FABLE ──
    var mkeys=Object.keys(byMonth).sort();
    var summaryData={
      financiero:{totBud:totBud,totEff:totEff,totLeads:totLeads,totWpp:totWpp,eficienciaPct:totBud?Math.round(totEff/totBud*100):null},
      porArea:byArea,
      tendenciaMensual:mkeys.map(function(k){return byMonth[k];}),
      canceladas:canceladas.map(function(c){return {codigo:c.codigo,categoria:c.cancelCategoria,motivo:c.motivoCancelacion};}),
      mailing:{totalEnviados:totEnv,aperturaPct:avgApertura,ctrPct:avgCTR,costo:totMailCost,cantidad:mailings.length},
      ventas:{totalFacturado:totFactura,inversionVinculada:totInvVinculada,roiPct:roiTotal,cantidad:ventas.length,porProducto:byProdVentas},
      actividadEquipo:byUser,
      totalCampanas:campaigns.length,
      totalCanceladas:canceladas.length
    };

    var prompt='Sos un analista senior de marketing digital. Con los siguientes datos reales de una empresa (sectores AGRO e Ingeniería), '
      +'escribí un informe ejecutivo completo en español, en un tono profesional y directo. '
      +'Usá EXACTAMENTE estos títulos de sección, cada uno en su propia línea empezando con "## ": '
      +'"## Resumen Ejecutivo", "## Resultados de Campañas", "## Mailings", "## Ventas y ROI", "## Presupuesto y Ejecución", "## Actividad del Equipo", "## Recomendaciones Prioritarias". '
      +'Cada sección debe tener 2 a 4 párrafos cortos o bullets, con números concretos citados de los datos. '
      +'En Recomendaciones Prioritarias dá máximo 5 acciones concretas y accionables. '
      +'No inventes datos que no estén en el JSON.\n\nDATOS:\n'+JSON.stringify(summaryData);

    body.innerHTML='<div class="informe-loading">✦ Fable está redactando el análisis ejecutivo...</div>';

    var resp=await fetch('https://mkt-ai-proxy.tcoppede.workers.dev/',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-fable-5',max_tokens:3000,messages:[{role:'user',content:prompt}]})
    });
    var data=await resp.json();
    var text=data.content&&data.content[0]?data.content[0].text:(data.error?('Error: '+(data.error.message||JSON.stringify(data.error))):'Sin respuesta de la IA.');

    // ── PARSE SECTIONS ──
    var sections={};
    var parts=text.split(/\n##\s+/).map(function(s,i){return i===0?s.replace(/^##\s+/,''):s;});
    parts.forEach(function(p){
      var nl=p.indexOf('\n');
      var title=nl>-1?p.slice(0,nl).trim():p.trim();
      var bodyTxt=nl>-1?p.slice(nl+1).trim():'';
      sections[title]=bodyTxt;
    });

    // ── BUILD CHARTS (SVG, computed by us, not the AI) ──
    function buildBarChart(dataObj,labelKey,valKey,color){
      var entries=Object.entries(dataObj);
      if(!entries.length)return '';
      var max=Math.max.apply(null,entries.map(function(e){return e[1][valKey]||0;}));
      return entries.map(function(e){
        var pct=max>0?Math.round((e[1][valKey]||0)/max*100):0;
        return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'
          +'<div style="width:90px;font-size:11px">'+e[0]+'</div>'
          +'<div style="flex:1;background:#ede9e1;border-radius:10px;height:10px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+color+';border-radius:10px"></div></div>'
          +'<div style="width:80px;text-align:right;font-size:11px;color:#9a9286">$'+Math.round(e[1][valKey]||0).toLocaleString()+'</div>'
          +'</div>';
      }).join('');
    }

    function buildLineChart(monthArr){
      if(monthArr.length<2)return '<p style="font-size:11px;color:#c4bfb5">No hay suficientes meses para graficar tendencia.</p>';
      var w=680,h=160,padL=55,padB=26,padT=10,padR=16;
      var maxV=Math.max.apply(null,monthArr.map(function(m){return Math.max(m.bud,m.eff);}),1);
      function px(i){return padL+(monthArr.length===1?0:i*(w-padL-padR)/(monthArr.length-1));}
      function py(v){return h-padB-Math.round(v/maxV*(h-padT-padB));}
      var effPts=monthArr.map(function(m,i){return px(i)+','+py(m.eff);}).join(' ');
      var budPts=monthArr.map(function(m,i){return px(i)+','+py(m.bud);}).join(' ');
      return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%">'
        +'<polyline points="'+budPts+'" fill="none" stroke="#1a4fa8" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.55"/>'
        +'<polyline points="'+effPts+'" fill="none" stroke="#1c6b45" stroke-width="2.4"/>'
        +monthArr.map(function(m,i){
          return '<circle cx="'+px(i)+'" cy="'+py(m.eff)+'" r="3.5" fill="#1c6b45"/>'
            +'<text x="'+px(i)+'" y="'+(h-padB+16)+'" text-anchor="middle" font-size="9" fill="#9a9286">'+m.label+'</text>';
        }).join('')
        +'</svg>';
    }

    var barAreaHTML=buildBarChart(byArea,'area','eff','#1c6b45');
    var lineChartHTML=buildLineChart(mkeys.map(function(k){return byMonth[k];}));
    var barProdVentasHTML=buildBarChart(byProdVentas,'prod','monto','#1a4fa8');

    // ── RENDER FULL REPORT ──
    var today=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});

    var html='<div class="informe-actions">'
      +'<button class="logs-refresh" onclick="window.print()">↓ Descargar / Imprimir PDF</button>'
      +'<button class="logs-refresh" onclick="generarInforme()">✦ Regenerar</button>'
      +'</div>'
      +'<div class="informe-doc">'
      +'<div class="informe-header"><div class="informe-title">Informe Ejecutivo · MKT</div><div class="informe-date">'+today+' · Generado con Claude Fable</div></div>'

      +'<div class="informe-kpis">'
      +'<div class="informe-kpi"><div class="informe-kpi-label">Invertido</div><div class="informe-kpi-val">'+fmtM(totEff)+'</div></div>'
      +'<div class="informe-kpi"><div class="informe-kpi-label">Presupuestado</div><div class="informe-kpi-val">'+fmtM(totBud)+'</div></div>'
      +'<div class="informe-kpi"><div class="informe-kpi-label">Campañas</div><div class="informe-kpi-val">'+campaigns.length+'</div></div>'
      +'<div class="informe-kpi"><div class="informe-kpi-label">Facturación</div><div class="informe-kpi-val">'+fmtM(totFactura)+'</div></div>'
      +'<div class="informe-kpi"><div class="informe-kpi-label">ROI</div><div class="informe-kpi-val">'+(roiTotal!==null?(roiTotal>0?'+':'')+roiTotal+'%':'—')+'</div></div>'
      +'</div>'

      +'<div class="informe-section"><div class="informe-section-title">Resumen Ejecutivo</div>'
      +'<div class="informe-section-body">'+(sections['Resumen Ejecutivo']||'Sin datos suficientes.').split('\n').join('<br>')+'</div></div>'

      +'<div class="informe-section"><div class="informe-section-title">Resultados de Campañas</div>'
      +'<div style="margin-bottom:14px">'+barAreaHTML+'</div>'
      +'<div class="informe-section-body">'+(sections['Resultados de Campañas']||'').split('\n').join('<br>')+'</div></div>'

      +'<div class="informe-section"><div class="informe-section-title">Tendencia mensual · Presupuesto vs Efectivo</div>'
      +lineChartHTML+'</div>'

      +'<div class="informe-section"><div class="informe-section-title">Mailings</div>'
      +'<div class="informe-section-body">'+(sections['Mailings']||'').split('\n').join('<br>')+'</div></div>'

      +'<div class="informe-section"><div class="informe-section-title">Ventas y ROI</div>'
      +(Object.keys(byProdVentas).length?'<div style="margin-bottom:14px">'+barProdVentasHTML+'</div>':'')
      +'<div class="informe-section-body">'+(sections['Ventas y ROI']||'').split('\n').join('<br>')+'</div></div>'

      +'<div class="informe-section"><div class="informe-section-title">Presupuesto y Ejecución</div>'
      +'<div class="informe-section-body">'+(sections['Presupuesto y Ejecución']||'').split('\n').join('<br>')+'</div></div>'

      +'<div class="informe-section"><div class="informe-section-title">Actividad del Equipo</div>'
      +'<div class="informe-section-body">'+(sections['Actividad del Equipo']||'').split('\n').join('<br>')+'</div></div>'

      +'<div class="informe-section" style="background:#fdf8ec;border:1px solid #f0dfa0;border-radius:10px;padding:18px 20px">'
      +'<div class="informe-section-title" style="color:#8a6500;border-bottom-color:#f0dfa0">Recomendaciones Prioritarias</div>'
      +'<div class="informe-section-body">'+(sections['Recomendaciones Prioritarias']||'').split('\n').join('<br>')+'</div></div>'

      +'</div>';

    body.innerHTML=html;

    var role=sessionStorage.getItem('panel_role');
    var user=sessionStorage.getItem('panel_user');
    logActivity(role,user,'ai_informe','Generó informe ejecutivo completo con Fable');

  }catch(e){
    body.innerHTML='<div class="informe-loading" style="color:#c0392b">Error al generar el informe: '+e.message+'</div>';
    console.error(e);
  }
}
</script>
</body>
</html>
