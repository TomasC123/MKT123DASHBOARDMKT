// ── DETAIL ───────────────────────────────────────────
function openDetail(id){
  detailId=id;
  var c=G.campaigns.find(function(x){return x.id===id;});if(!c)return;
  var col=tColor(c.tipo),sc=campScore(c),dev=desvio(c);
  var cplV=cpl(c),wppV=cpcW(c),effV=effPct(c);
  var isMailing=c.tipo==='MAILING';
  var ctr=c.mailEnviados&&c.mailClicks?Math.round(c.mailClicks/c.mailEnviados*100):null;
  var cpc=c.mailClicks&&c.effTotal?Math.round(c.effTotal/c.mailClicks):null;
  var variance=c.effTotal!=null&&c.budTotal!=null?c.effTotal-c.budTotal:null;

  document.getElementById('dm-title').innerHTML=c.codigo
    +(c.dobleVersion?'<span style="display:inline-block;margin-left:8px;padding:2px 8px;border-radius:20px;font-size:10px;font-family:var(--mono);background:var(--goldg);color:var(--gold);border:1px solid var(--goldb)">doble versión</span>':'')
    +(c.cancelada?'<span style="display:inline-block;margin-left:8px;padding:2px 8px;border-radius:20px;font-size:10px;font-family:var(--mono);background:var(--rbg);color:var(--red);border:1px solid var(--rb)">cancelada</span>':'');
  document.getElementById('dm-edit-btn').onclick=function(){closeDetail();editCamp(id);};
  document.getElementById('dm-del-btn').onclick=function(){if(!confirm('¿Eliminar?'))return;G.campaigns=G.campaigns.filter(function(x){return x.id!==id;});syncSave();closeDetail();renderLista();};
  var cancelBtn=document.getElementById('dm-cancel-btn');
  if(c.cancelada){
    cancelBtn.textContent='Reactivar campaña';
    cancelBtn.style.background='var(--muted)';
    cancelBtn.style.color='var(--dim)';
    cancelBtn.onclick=function(){c.cancelada=false;c.motivoCancelacion='';syncSave();closeDetail();renderLista();};
  }else{
    cancelBtn.textContent='Cancelar campaña';
    cancelBtn.style.background='';cancelBtn.style.color='';
    cancelBtn.onclick=function(){openCancelModal(id);};
  }

  var kpis=[{l:'Presupuestado',v:fmt(c.budTotal),c:'blue'},{l:'Efectivo',v:fmt(c.effTotal),c:'green'}];
  if(isMailing){
    kpis.push({l:'Enviados',v:fmtn(c.mailEnviados),c:'neutral',s:'emails'});
    kpis.push({l:'Apertura',v:c.mailApertura?c.mailApertura+'%':'—',c:c.mailApertura?'gold':'neutral'});
    kpis.push({l:'Clicks',v:fmtn(c.mailClicks),c:ctr?'green':'neutral',s:ctr?'CTR '+ctr+'%':''});
    kpis.push({l:'Costo/click',v:cpc?'$'+cpc:'—',c:cpc?'purple':'neutral'});
  }else{
    kpis.push({l:'CPL',v:cplV?'$'+cplV:'—',c:cplV?'gold':'neutral',s:'por lead'});
    kpis.push({l:'CPC WhatsApp',v:wppV?'$'+wppV:'—',c:wppV?'purple':'neutral'});
  }
  kpis.push({l:'Eficiencia',v:effV?effV+'%':'—',c:effV?(effV<=100?'green':'red'):'neutral'});
  kpis.push({l:'Score',v:sc!==null?sc:'—',c:sc!==null?(sc>=70?'green':sc>=40?'gold':'red'):'neutral'});
  if(dev!==null)kpis.push({l:'Desvío',v:(dev>0?'+':'')+dev+' días',c:dev>0?'red':dev<0?'green':'neutral'});

  var html='<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">'+kpis.map(function(k){
    return '<div class="kpi '+k.c+'"><div class="kl">'+k.l+'</div><div class="kv" style="font-size:18px">'+k.v+'</div>'+(k.s?'<div class="ks">'+k.s+'</div>':'')+'</div>';
  }).join('')+'</div>';

  if(variance!==null){
    html+='<div style="margin-bottom:14px;padding:9px 13px;border-radius:var(--r);background:'+(variance>0?'var(--rbg)':'var(--gbg)')+';border:1px solid '+(variance>0?'var(--rb)':'var(--gb)')+'">'
      +'<span style="font-size:11px;color:'+(variance>0?'var(--red)':'var(--green)')+'">'
      +(variance>0?'▲ Excedió el presupuesto en $'+Math.abs(variance).toLocaleString():'▼ Gastó $'+Math.abs(variance).toLocaleString()+' menos de lo presupuestado')
      +'</span></div>';
  }

  html+='<div class="dg">'
    +'<div class="di"><div class="dlb">Fecha de carga</div><div style="font-size:12px;color:var(--dim)">'+fDate(c.fechaCarga)+'</div></div>'
    +'<div class="di"><div class="dlb">Fecha de inicio</div><div style="font-size:12px">'+fDate(c.fecha)+'</div></div>'
    +'<div class="di"><div class="dlb">Producto</div><div style="font-size:12px"><strong>'+(pName(c.producto)||'—')+'</strong> <span style="font-size:10px;color:var(--faint)">'+(pArea(c.producto)||'')+'</span></div></div>'
    +'<div class="di"><div class="dlb">Tipo / Modo</div><div style="font-size:12px"><span style="display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:500;background:'+rgba(col,.1)+';color:'+col+';border:1px solid '+rgba(col,.25)+'">'+c.tipo+'</span>'+(c.modo?' '+c.modo:'')+'</div></div>'
    +'<div class="di"><div class="dlb">F. planificada / real</div><div style="font-size:12px">'+fDate(c.fechaPlan)+' → '+fDate(c.fechaReal)+'</div></div>'
    +'<div class="di"><div class="dlb">Presup. / Efec.</div><div style="font-size:12px">'+fmt(c.budDia)+' × '+(c.budDias||'—')+' / '+fmt(c.effDia)+' × '+(c.effDias||'—')+'</div></div>'
    +(isMailing
      ?'<div class="di"><div class="dlb">Proveedor</div><div style="font-size:12px">'+(c.mailProvTipo||'—')+(c.mailProv?' · '+c.mailProv:'')+'</div></div>'
      :'<div class="di"><div class="dlb">Leads</div><div style="font-family:var(--serif);font-size:22px">'+(c.leads!=null?c.leads:'—')+'</div></div>'
       +'<div class="di"><div class="dlb">WPP</div><div style="font-family:var(--serif);font-size:22px">'+(c.wpp!=null?c.wpp:'—')+'</div></div>'
    )
    +((c.leadsAlta||c.leadsMedia||c.leadsBaja)?
      '<div class="di dfc" style="background:var(--goldg);border-radius:var(--r);padding:10px 14px;margin-top:4px">'
      +'<div class="dlb" style="color:var(--gold);margin-bottom:8px">Calificación de leads</div>'
      +'<div style="display:flex;gap:20px;flex-wrap:wrap">'
      +'<div><div style="font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.08em">ALTA</div><div style="font-family:var(--serif);font-size:22px">'+(c.leadsAlta||0)+'</div></div>'
      +'<div><div style="font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em">MEDIA</div><div style="font-family:var(--serif);font-size:22px">'+(c.leadsMedia||0)+'</div></div>'
      +'<div><div style="font-size:10px;color:var(--red);text-transform:uppercase;letter-spacing:.08em">BAJA</div><div style="font-family:var(--serif);font-size:22px">'+(c.leadsBaja||0)+'</div></div>'
      +(c.leadsAlta&&c.leads?'<div><div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em">Tasa calidad</div><div style="font-family:var(--serif);font-size:22px">'+Math.round(c.leadsAlta/c.leads*100)+'%</div></div>':'')
      +(c.leadsAlta&&c.effTotal?'<div><div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em">CPL ALTA</div><div style="font-family:var(--serif);font-size:22px">$'+Math.round(c.effTotal/c.leadsAlta)+'</div></div>':'')
      +'</div></div>'
    :'')
    +(c.segmentacion?'<div class="di dfc"><div class="dlb">Segmentación</div><div style="font-size:12px;color:var(--dim)">'+c.segmentacion+'</div></div>':'')
    +(c.cancelada?'<div class="di dfc" style="background:var(--rbg);border-radius:var(--r);padding:10px 14px;margin-top:4px">'
      +'<div class="dlb" style="color:var(--red);margin-bottom:6px">Cancelación</div>'
      +'<div style="display:flex;gap:16px;flex-wrap:wrap">'
      +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin-bottom:2px">Categoría</div><div style="font-size:12px;font-weight:500">'+(c.cancelCategoria||'—')+'</div></div>'
      +(c.fechaCancelacion?'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin-bottom:2px">Fecha</div><div style="font-size:12px">'+fDate(c.fechaCancelacion)+'</div></div>':'')
      +(c.motivoCancelacion?'<div style="flex:1;min-width:200px"><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin-bottom:2px">Detalle</div><div style="font-size:12px;color:var(--dim)">'+c.motivoCancelacion+'</div></div>':'')
      +'</div></div>':'')
    +(c.notas?'<div class="di dfc"><div class="dlb">Notas</div><div style="font-size:12px;color:var(--dim);line-height:1.6">'+c.notas+'</div></div>':'')
    +'</div>';

  // Versiones comparison
  if(c.versiones&&c.versiones.length){
    html+='<div style="margin-top:16px"><div class="dlb" style="margin-bottom:8px">Comparativa de versiones creativas</div>'
      +'<table class="dt"><thead><tr><th>#</th><th>Período</th><th>Formato</th><th>Motivo</th>'
      +'<th style="text-align:right">Días</th><th style="text-align:right">Gasto</th><th style="text-align:right">Leads</th>'
      +'<th style="text-align:right">WPP</th><th style="text-align:right">CPL/CPC</th></tr></thead><tbody>'
      +c.versiones.map(function(ver,i){
        var cplV=ver.leads&&ver.gasto?Math.round(ver.gasto/ver.leads):null;
        var cpcV=ver.wpp&&ver.gasto?Math.round(ver.gasto/ver.wpp):null;
        var diasV=(ver.fechaDesde&&ver.fechaHasta)?Math.max(0,Math.round((new Date(ver.fechaHasta+'T00:00:00')-new Date(ver.fechaDesde+'T00:00:00'))/86400000)+1):null;
        return '<tr>'
          +'<td>'+(i+1)+(i===0?' <span style="font-size:9px;color:var(--faint)">orig.</span>':'')+'</td>'
          +'<td style="color:var(--dim);font-size:11px">'+fDate(ver.fechaDesde)+' → '+fDate(ver.fechaHasta)+'</td>'
          +'<td>'+(ver.formato||'—')+'</td>'
          +'<td style="font-size:11px;color:var(--dim);max-width:160px">'+(ver.motivo||'—')+'</td>'
          +'<td style="text-align:right">'+(diasV!==null?diasV:'—')+'</td>'
          +'<td style="text-align:right">'+(ver.gasto?'$'+ver.gasto.toLocaleString():'—')+'</td>'
          +'<td style="text-align:right">'+(ver.leads||'—')+'</td>'
          +'<td style="text-align:right">'+(ver.wpp||'—')+'</td>'
          +'<td style="text-align:right;font-weight:500;color:'+(cplV||cpcV?'var(--green)':'var(--faint)')+'">'+(cplV?'$'+cplV:cpcV?'$'+cpcV:'—')+'</td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }

  // Comments log
  if(c.comments&&c.comments.length){
    html+='<div style="margin-top:16px"><div class="dlb" style="margin-bottom:8px">Comentarios</div>'
      +'<div style="display:flex;flex-direction:column;gap:6px">'
      +c.comments.slice().reverse().map(function(cm){
        return '<div style="padding:7px 10px;background:var(--muted);border-radius:var(--r);border:1px solid var(--brd)">'
          +'<span style="font-size:9px;color:var(--faint)">'+fDate(cm.fecha)+'</span> '
          +'<span style="font-size:12px">'+cm.texto+'</span></div>';
      }).join('')
      +'</div></div>';
  }

  document.getElementById('dm-body').innerHTML=html;
  document.getElementById('mod-detail').classList.add('on');
}

function closeDetail(){document.getElementById('mod-detail').classList.remove('on');detailId=null;}

function openCancelModal(id){
  document.getElementById('mod-detail').classList.remove('on');
  document.getElementById('mod-cancel').classList.add('on');
  document.getElementById('cancel-motivo').value='';
  document.getElementById('cancel-cat').value='Operativa';
  document.getElementById('cancel-confirm-btn').onclick=function(){
    var c=G.campaigns.find(function(x){return x.id===id;});
    if(!c)return;
    c.cancelada=true;
    c.cancelCategoria=document.getElementById('cancel-cat').value;
    c.motivoCancelacion=document.getElementById('cancel-motivo').value.trim();
    c.fechaCancelacion=new Date().toISOString().slice(0,10);
    syncSave();
    document.getElementById('mod-cancel').classList.remove('on');
    closeDetail();renderLista();
  };
}
document.getElementById('mod-detail').onclick=function(e){if(e.target===e.currentTarget)closeDetail();};

// ── DASHBOARD ────────────────────────────────────────
function setTab(t){
  dashTab=t;
  document.getElementById('tab-fin').classList.toggle('on',t==='fin');
  document.getElementById('tab-ops').classList.toggle('on',t==='ops');
  renderDash();
}

function getDashCamps(){
  var yf=gv('dy'),mf=gv('dm'),af=gv('da'),pf=gv('dp'),tf=gv('dt2');
  return G.campaigns.filter(function(c){
    if(yf&&c.anio!=yf)return false;
    if(mf!==''&&c.mes!==parseInt(mf))return false;
    if(tf&&c.tipo!==tf)return false;
    if(pf&&c.producto!==pf)return false;
    if(af){var p=getProd(c.producto);if(!p||p.area!==af)return false;}
    return true;
  });
}

function renderDash(){
  populateFilters();
  var camps=getDashCamps(),el=document.getElementById('dash-content');if(!el)return;
  if(!camps.length){el.innerHTML='<div class="empty"><p>Sin campañas.</p><button class="btn btn-ink" onclick="newCamp()" style="margin-top:12px">+ Nueva</button></div>';return;}
  if(dashTab==='ops')renderOperativo(camps,el);
  else renderFinanciero(camps,el);
}

function renderFinanciero(camps,el){
  var totB=0,totE=0,totL=0,totW=0;
  camps.forEach(function(c){if(c.budTotal)totB+=c.budTotal;if(c.effTotal)totE+=c.effTotal;if(!c.sinLeads&&c.leads)totL+=c.leads;if(!c.sinLeads&&c.wpp)totW+=c.wpp;});
  var totCPL=totL&&totE?Math.round(totE/totL):null;
  var totWPC=totW&&totE?Math.round(totE/totW):null;
  var totEff=totB?Math.round(totE/totB*100):null;
  var variance=totE-totB;

  var byTipo={},byProd={},byArea={},byMonth={};
  G.tipos.forEach(function(t){byTipo[t.name]={count:0,bud:0,eff:0,leads:0,wpp:0};});
  camps.forEach(function(c){
    if(!byTipo[c.tipo])byTipo[c.tipo]={count:0,bud:0,eff:0,leads:0,wpp:0};
    byTipo[c.tipo].count++;if(c.budTotal)byTipo[c.tipo].bud+=c.budTotal;if(c.effTotal)byTipo[c.tipo].eff+=c.effTotal;if(c.leads)byTipo[c.tipo].leads+=c.leads;if(c.wpp)byTipo[c.tipo].wpp+=c.wpp;
    var n=pName(c.producto);if(!byProd[n])byProd[n]={count:0,eff:0,leads:0,wpp:0};byProd[n].count++;if(c.effTotal)byProd[n].eff+=c.effTotal;if(c.leads)byProd[n].leads+=c.leads;if(c.wpp)byProd[n].wpp+=c.wpp;
    var p=getProd(c.producto);var a=p?p.area:'Otros';if(!byArea[a])byArea[a]={count:0,eff:0,bud:0,leads:0,wpp:0};byArea[a].count++;if(c.effTotal)byArea[a].eff+=c.effTotal;if(c.budTotal)byArea[a].bud+=c.budTotal;if(c.leads)byArea[a].leads+=c.leads;if(c.wpp)byArea[a].wpp+=c.wpp;
    var mk=c.anio+'-'+String(c.mes).padStart(2,'0');if(!byMonth[mk])byMonth[mk]={label:MONTHS[c.mes].slice(0,3)+' '+String(c.anio).slice(2),bud:0,eff:0,leads:0};if(c.budTotal)byMonth[mk].bud+=c.budTotal;if(c.effTotal)byMonth[mk].eff+=c.effTotal;if(c.leads)byMonth[mk].leads+=c.leads;
  });

  var byCPL=camps.filter(function(c){return c.leads&&c.effTotal;}).map(function(c){return {cod:c.codigo,leads:c.leads,eff:c.effTotal,cplV:Math.round(c.effTotal/c.leads)};}).sort(function(a,b){return a.cplV-b.cplV;}).slice(0,5);
  var mkeys=Object.keys(byMonth).sort().slice(-6);

  // Build tipo breakdown for total invertido card
  var tipoBreakdown=Object.entries(byTipo).filter(function(e){return e[1].eff>0;}).sort(function(a,b){return b[1].eff-a[1].eff;}).map(function(e){
    var col=tColor(e[0]);
    return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--dim)">'
      +'<span style="width:6px;height:6px;border-radius:50%;background:'+col+';display:inline-block;flex-shrink:0"></span>'
      +e[0]+' $'+e[1].eff.toLocaleString()
      +'</span>';
  }).join('<span style="color:var(--faint);margin:0 3px">·</span>');

  var html='<div class="kpi-grid">'
    +'<div class="kpi green" style="grid-column:1/-1 !important"><div class="kl">Total invertido</div>'
    +'<div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">'
    +'<div class="kv">$'+totE.toLocaleString()+'</div>'
    +'<div style="font-size:10px;color:var(--dim)">'+camps.length+' campañas</div>'
    +'</div>'
    +(tipoBreakdown?'<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">'+tipoBreakdown+'</div>':'')
    +'</div>'
    +'<div class="kpi blue"><div class="kl">Presupuestado</div><div class="kv">$'+totB.toLocaleString()+'</div><div class="ks" style="color:'+(variance>0?'var(--red)':'var(--green)')+'">'+(variance>0?'▲':'▼')+' $'+Math.abs(variance).toLocaleString()+'</div></div>'
    +'<div class="kpi gold"><div class="kl">CPL promedio</div><div class="kv">'+(totCPL?'$'+totCPL:'—')+'</div><div class="ks">'+totL+' leads</div></div>'
    +'<div class="kpi purple"><div class="kl">CPC WhatsApp</div><div class="kv">'+(totWPC?'$'+totWPC:'—')+'</div><div class="ks">'+totW+' contactos</div></div>'
    +'<div class="kpi '+(totEff?totEff<=100?'green':'red':'neutral')+'"><div class="kl">Eficiencia</div><div class="kv">'+(totEff?totEff+'%':'—')+'</div><div class="ks">efec/pres</div></div>'
    +'</div>';

  html+='<div class="cg">';
  var maxTE=Math.max.apply(null,Object.values(byTipo).map(function(v){return v.eff;}).concat([1]));
  html+='<div class="cc"><div class="cct">Por tipo</div>'
    +Object.entries(byTipo).filter(function(e){return e[1].count>0;}).sort(function(a,b){return b[1].eff-a[1].eff;}).map(function(e){
      var col=tColor(e[0]),pct=Math.round(e[1].eff/maxTE*100);
      var cplT=e[1].leads&&e[1].eff?'CPL $'+Math.round(e[1].eff/e[1].leads):'';
      return '<div class="br"><div class="bl">'+e[0]+'</div><div class="bt"><div class="bf" style="width:'+pct+'%;background:'+col+'"></div></div><div class="bv">$'+e[1].eff.toLocaleString()+(cplT?'<br><span style="font-size:9px;color:var(--faint)">'+cplT+'</span>':'')+'</div></div>';
    }).join('')+'</div>';

  var maxPE=Math.max.apply(null,Object.values(byProd).map(function(v){return v.eff;}).concat([1]));
  html+='<div class="cc"><div class="cct">Por producto</div>'
    +Object.entries(byProd).sort(function(a,b){return b[1].eff-a[1].eff;}).map(function(e){
      var pct=Math.round(e[1].eff/maxPE*100);
      var cplT=e[1].leads&&e[1].eff?'CPL $'+Math.round(e[1].eff/e[1].leads):'';
      return '<div class="br"><div class="bl">'+e[0]+'</div><div class="bt"><div class="bf" style="width:'+pct+'%;background:var(--ink)"></div></div><div class="bv">$'+e[1].eff.toLocaleString()+(cplT?'<br><span style="font-size:9px;color:var(--faint)">'+cplT+'</span>':'')+'</div></div>';
    }).join('')+'</div>';
  html+='</div><div class="cg">';

  if(mkeys.length>1){
    var maxM=Math.max.apply(null,mkeys.map(function(k){return Math.max(byMonth[k].bud,byMonth[k].eff);}));
    html+='<div class="cc"><div class="cct">Tendencia mensual</div>'
      +mkeys.map(function(k){
        var v=byMonth[k],pB=maxM>0?Math.round(v.bud/maxM*100):0,pE=maxM>0?Math.round(v.eff/maxM*100):0;
        return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:3px"><span>'+v.label+'</span></div>'
          +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><div style="flex:1;height:6px;background:var(--muted);border-radius:6px;overflow:hidden"><div style="width:'+pB+'%;height:100%;background:var(--blue);border-radius:6px"></div></div><span style="font-size:9px;color:var(--dim);min-width:55px;text-align:right">$'+v.bud.toLocaleString()+'</span></div>'
          +'<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:6px;background:var(--muted);border-radius:6px;overflow:hidden"><div style="width:'+pE+'%;height:100%;background:var(--green);border-radius:6px"></div></div><span style="font-size:9px;color:var(--dim);min-width:55px;text-align:right">$'+v.eff.toLocaleString()+'</span></div></div>';
      }).join('')+'</div>';
  }

  if(byCPL.length){
    html+='<div class="cc"><div class="cct">Mejores campañas por CPL</div>'
      +byCPL.map(function(c,i){
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--brd)">'
          +'<span style="font-size:11px">'+['🥇','🥈','🥉','4.','5.'][i]+' '+c.cod+'</span>'
          +'<div style="text-align:right"><div style="font-size:12px;font-weight:500;color:var(--green)">$'+c.cplV+'/lead</div>'
          +'<div style="font-size:9px;color:var(--faint)">'+c.leads+' leads</div></div></div>';
      }).join('')+'</div>';
  }
  html+='</div>';

  if(Object.keys(byArea).length>1){
    html+='<div class="card"><div class="ct">Por área</div><table class="dt"><thead><tr><th>Área</th><th style="text-align:right">Camps.</th><th style="text-align:right">Pres.</th><th style="text-align:right">Efectivo</th><th style="text-align:right">Leads</th><th style="text-align:right">CPL</th><th style="text-align:right">WPP</th></tr></thead><tbody>'
      +Object.entries(byArea).sort(function(a,b){return b[1].eff-a[1].eff;}).map(function(e){
        var v=e[1];return '<tr><td><strong>'+e[0]+'</strong></td><td style="text-align:right">'+v.count+'</td><td style="text-align:right">$'+v.bud.toLocaleString()+'</td><td style="text-align:right">$'+v.eff.toLocaleString()+'</td><td style="text-align:right">'+v.leads+'</td><td style="text-align:right">'+(v.leads&&v.eff?'$'+Math.round(v.eff/v.leads):'—')+'</td><td style="text-align:right">'+v.wpp+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }

  // ING leads quality summary
  var ingCamps=camps.filter(function(c){return c.leadsAlta||c.leadsMedia||c.leadsBaja;});
  if(ingCamps.length){
    var totAlta=0,totMedia=0,totBaja=0,totIngEff=0;
    ingCamps.forEach(function(c){totAlta+=c.leadsAlta||0;totMedia+=c.leadsMedia||0;totBaja+=c.leadsBaja||0;if(c.effTotal)totIngEff+=c.effTotal;});
    var totIngLeads=totAlta+totMedia+totBaja;
    var tasaCal=totIngLeads?Math.round(totAlta/totIngLeads*100):null;
    var cplAlta=totAlta&&totIngEff?Math.round(totIngEff/totAlta):null;
    html+='<div class="card" style="border-left:3px solid var(--gold)"><div class="ct" style="color:var(--gold)">INGENIERÍA · Calificación de leads</div>'
      +'<div class="kpi-grid">'
      +'<div class="kpi green"><div class="kl">Leads ALTA</div><div class="kv">'+totAlta+'</div><div class="ks">'+(cplAlta?'CPL $'+cplAlta:'')+'</div></div>'
      +'<div class="kpi gold"><div class="kl">Leads MEDIA</div><div class="kv">'+totMedia+'</div></div>'
      +'<div class="kpi red"><div class="kl">Leads BAJA</div><div class="kv">'+totBaja+'</div></div>'
      +'<div class="kpi '+(tasaCal>=50?'green':tasaCal>=30?'gold':'red')+'"><div class="kl">Tasa de calidad</div><div class="kv">'+(tasaCal?tasaCal+'%':'—')+'</div><div class="ks">% leads ALTA</div></div>'
      +'</div></div>';
  }

  // ── MES A MES COMPARATIVO ───────────────────────────
  var allMonths={};
  G.campaigns.filter(function(c){return !c.cancelada;}).forEach(function(c){
    var mk=c.anio+'-'+String(c.mes).padStart(2,'0');
    if(!allMonths[mk])allMonths[mk]={label:MONTHS[c.mes].slice(0,3)+' '+String(c.anio).slice(2),eff:0,leads:0,wpp:0,camps:0,mes:c.mes,anio:c.anio};
    allMonths[mk].camps++;
    if(c.effTotal)allMonths[mk].eff+=c.effTotal;
    if(!c.sinLeads&&c.leads)allMonths[mk].leads+=c.leads;
    if(!c.sinLeads&&c.wpp)allMonths[mk].wpp+=c.wpp;
  });
  var allKeys=Object.keys(allMonths).sort();
  if(allKeys.length>=2){
    html+='<div class="card"><div class="ct">Comparativo mes a mes</div>'
      +'<div style="overflow-x:auto"><table class="dt"><thead><tr>'
      +'<th>Mes</th><th style="text-align:right">Campañas</th><th style="text-align:right">Invertido</th>'
      +'<th style="text-align:right">Var. vs anterior</th>'
      +'<th style="text-align:right">Leads</th><th style="text-align:right">WPP</th>'
      +'<th style="text-align:right">CPL</th><th style="text-align:right">CPC WPP</th>'
      +'</tr></thead><tbody>'
      +allKeys.map(function(mk,i){
        var v=allMonths[mk];
        var prev=i>0?allMonths[allKeys[i-1]]:null;
        var varEff=prev&&prev.eff?Math.round((v.eff-prev.eff)/prev.eff*100):null;
        var cplV=v.leads&&v.eff?Math.round(v.eff/v.leads):null;
        var wppV=v.wpp&&v.eff?Math.round(v.eff/v.wpp):null;
        var isCurrent=allKeys[i]===allKeys[allKeys.length-1];
        return '<tr style="'+(isCurrent?'background:var(--muted);font-weight:500':'')+'">'
          +'<td>'+v.label+(isCurrent?' <span style="font-size:9px;color:var(--faint)">actual</span>':'')+'</td>'
          +'<td style="text-align:right">'+v.camps+'</td>'
          +'<td style="text-align:right">$'+v.eff.toLocaleString()+'</td>'
          +'<td style="text-align:right">'+(varEff!==null?'<span style="color:'+(varEff>0?'var(--red)':'var(--green)')+'">'+(varEff>0?'▲':'▼')+Math.abs(varEff)+'%</span>':'—')+'</td>'
          +'<td style="text-align:right">'+v.leads+'</td>'
          +'<td style="text-align:right">'+v.wpp+'</td>'
          +'<td style="text-align:right">'+(cplV?'$'+cplV:'—')+'</td>'
          +'<td style="text-align:right">'+(wppV?'$'+wppV:'—')+'</td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div></div>';
  }

  // ── CPL POR ÁREA ─────────────────────────────────────
  var cplByArea={};
  camps.filter(function(c){return !c.cancelada&&!c.sinLeads;}).forEach(function(c){
    var p=getProd(c.producto);var a=p?p.area:'Otros';
    if(!cplByArea[a])cplByArea[a]={eff:0,leads:0,wpp:0};
    if(c.effTotal)cplByArea[a].eff+=c.effTotal;
    if(c.leads)cplByArea[a].leads+=c.leads;
    if(c.wpp)cplByArea[a].wpp+=c.wpp;
  });
  if(Object.keys(cplByArea).length>0){
    html+='<div class="card"><div class="ct">CPL por área</div>'
      +'<div class="kpi-grid">';
    Object.entries(cplByArea).forEach(function(e){
      var v=e[1];
      var isAgro=e[0]==='AGRO';
      // AGRO: usa WPP como métrica principal
      // ING: usa leads META
      var mainMetric=isAgro?(v.wpp&&v.eff?Math.round(v.eff/v.wpp):null):(v.leads&&v.eff?Math.round(v.eff/v.leads):null);
      var mainLabel=isAgro?'CPC WhatsApp':'CPL Meta';
      var mainCount=isAgro?v.wpp+' contactos WPP':v.leads+' leads';
      html+='<div class="kpi gold"><div class="kl">'+e[0]+' · '+mainLabel+'</div>'
        +'<div class="kv">'+(mainMetric?'$'+mainMetric:'—')+'</div>'
        +'<div class="ks">'+mainCount+' · $'+v.eff.toLocaleString()+' invertidos</div></div>';
    });
    html+='</div></div>';
  }

  // ── GRÁFICO DE LÍNEAS: PRESUPUESTO MES A MES ─────────
  if(allKeys.length>=1){
    var pts=allKeys.slice(-8);
    var n=pts.length;
    var maxEff=Math.max.apply(null,pts.map(function(k){return allMonths[k].eff;}));
    var maxBud=Math.max.apply(null,pts.map(function(k){return byMonth[k]?byMonth[k].bud:0;}));
    var maxVal=Math.max(maxEff,maxBud,1);

    var chartW=700,chartH=200,padL=65,padB=36,padT=28,padR=24;
    var innerW=chartW-padL-padR,innerH=chartH-padT-padB;

    function px2(i){return padL+(n===1?innerW/2:i*innerW/(n-1));}
    function py2(val){return chartH-padB-Math.round(val/maxVal*innerH);}

    // Grid values
    var gridVals=[0.25,0.5,0.75,1].map(function(p){return Math.round(maxVal*p);});

    var effPts2=pts.map(function(k,i){return px2(i)+','+py2(allMonths[k].eff);}).join(' ');
    var budPts2=pts.map(function(k,i){var b=byMonth[k]?byMonth[k].bud:0;return px2(i)+','+py2(b);}).join(' ');

    var alertMonths=pts.filter(function(k){return byMonth[k]&&byMonth[k].bud&&allMonths[k].eff>byMonth[k].bud*1.1;});

    // Acumulado desde Mayo 2026 — usa TODAS las campañas sin filtrar
    // mes es 0-indexed: Mayo=4, Junio=5, etc.
    var acumEff=0,acumBud=0;
    G.campaigns.filter(function(c){
      if(c.cancelada)return false;
      if(c.anio>2026)return true;
      if(c.anio===2026&&c.mes>=4)return true; // mes>=4 = Mayo en adelante
      return false;
    }).forEach(function(c){
      if(c.effTotal)acumEff+=c.effTotal;
      if(c.budTotal)acumBud+=c.budTotal;
    });
    var acumVar=acumBud?Math.round((acumEff-acumBud)/acumBud*100):null;

    var svg='<svg viewBox="0 0 '+chartW+' '+chartH+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">'
      // Grid
      +gridVals.map(function(val){
        var y=py2(val);
        return '<line x1="'+padL+'" y1="'+y+'" x2="'+(chartW-padR)+'" y2="'+y+'" stroke="#ede9e1" stroke-width="1"/>'
          +'<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#c4bfb5">$'+val.toLocaleString()+'</text>';
      }).join('')
      // Area fill under eff line
      +(n>1?'<polygon points="'+px2(0)+','+(chartH-padB)+' '+effPts2+' '+px2(n-1)+','+(chartH-padB)+'" fill="#1c6b45" opacity="0.07"/>':'')
      // Budget line
      +(n>1?'<polyline points="'+budPts2+'" fill="none" stroke="#1a4fa8" stroke-width="2" stroke-dasharray="5,4" opacity="0.6"/>':'')
      // Eff line
      +(n>1?'<polyline points="'+effPts2+'" fill="none" stroke="#1c6b45" stroke-width="2.5"/>':'')
      // Dots + values
      +pts.map(function(k,i){
        var v=allMonths[k];
        var bud=byMonth[k]?byMonth[k].bud:0;
        var over=bud&&v.eff>bud*1.1;
        var x=px2(i),ye=py2(v.eff),yb=py2(bud);
        return (n>1?'<circle cx="'+x+'" cy="'+ye+'" r="4.5" fill="'+(over?'#c0392b':'#1c6b45')+'" stroke="white" stroke-width="1.5"/>':'')
          +(bud&&n>1?'<circle cx="'+x+'" cy="'+yb+'" r="3" fill="#1a4fa8" opacity="0.5"/>':'')
          +'<text x="'+x+'" y="'+(ye-10)+'" text-anchor="middle" font-size="10" fill="'+(over?'#c0392b':'#1c6b45')+'" font-weight="600">$'+v.eff.toLocaleString()+'</text>'
          +'<text x="'+x+'" y="'+(chartH-padB+18)+'" text-anchor="middle" font-size="10" fill="#9a9286">'+v.label+'</text>';
      }).join('')
      // Legend
      +'<circle cx="'+(padL+6)+'" cy="'+(padT-10)+'" r="4" fill="#1c6b45"/>'
      +'<text x="'+(padL+14)+'" y="'+(padT-6)+'" font-size="10" fill="#9a9286">Efectivo</text>'
      +'<line x1="'+(padL+70)+'" y1="'+(padT-10)+'" x2="'+(padL+86)+'" y2="'+(padT-10)+'" stroke="#1a4fa8" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>'
      +'<text x="'+(padL+90)+'" y="'+(padT-6)+'" font-size="10" fill="#9a9286">Presupuestado</text>'
      +(alertMonths.length?'<text x="'+(padL+190)+'" y="'+(padT-6)+'" font-size="10" fill="#c0392b">● exceso &gt;10% en: '+alertMonths.map(function(k){return allMonths[k].label;}).join(', ')+'</text>':'')
      +'</svg>';

    // Card with chart + acumulado sidebar
    html+='<div class="card"><div class="ct">Inversión mensual · presupuesto vs efectivo</div>'
      +'<div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">'
      +'<div style="flex:1;min-width:300px">'+svg+'</div>'
      +'<div style="min-width:160px;display:flex;flex-direction:column;gap:10px;padding-top:8px">'
      +'<div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:2px">Acumulado desde Mayo 2026</div>'
      +'<div><div style="font-size:9px;color:var(--dim);margin-bottom:2px">Total efectivo</div><div style="font-family:var(--serif);font-size:24px;color:var(--green)">$'+acumEff.toLocaleString()+'</div></div>'
      +(acumBud?'<div><div style="font-size:9px;color:var(--dim);margin-bottom:2px">Total presupuestado</div><div style="font-family:var(--serif);font-size:20px">$'+acumBud.toLocaleString()+'</div></div>':'')
      +(acumVar!==null?'<div><div style="font-size:9px;color:var(--dim);margin-bottom:2px">Variación</div><div style="font-family:var(--serif);font-size:20px;color:'+(acumVar>0?'var(--red)':'var(--green)')+'">'+(acumVar>0?'▲':'▼')+Math.abs(acumVar)+'%</div></div>':'')
      +'<div style="margin-top:4px;padding-top:10px;border-top:1px solid var(--brd)"><div style="font-size:9px;color:var(--dim);margin-bottom:2px">Meses activos</div><div style="font-family:var(--serif);font-size:20px">'+[...new Set(G.campaigns.filter(function(c){if(c.cancelada)return false;if(c.anio>2026)return true;if(c.anio===2026&&c.mes>=4)return true;return false;}).map(function(c){return c.anio+'-'+String(c.mes).padStart(2,'0');}))].length+'</div></div>'
      +'</div>'
      +'</div>';

    if(alertMonths.length){
      html+='<div style="margin-top:12px;padding:9px 13px;border-radius:var(--r);background:var(--rbg);border:1px solid var(--rb)">'
        +'<span style="font-size:11px;color:var(--red)">▲ Meses que superaron el presupuesto en más del 10%: '
        +alertMonths.map(function(k){return allMonths[k].label;}).join(', ')+'</span></div>';
    }
    html+='</div>';
  }

  var mailCamps=camps.filter(function(c){return c.tipo==='MAILING';});
  if(mailCamps.length){
    var tEnv=0,tCl=0,tAp=0,apN=0,mailEff=0;
    mailCamps.forEach(function(c){if(c.mailEnviados)tEnv+=c.mailEnviados;if(c.mailClicks)tCl+=c.mailClicks;if(c.mailApertura){tAp+=c.mailApertura;apN++;}if(c.effTotal)mailEff+=c.effTotal;});
    var avgAp=apN?Math.round(tAp/apN*10)/10:null,gCTR=tEnv&&tCl?Math.round(tCl/tEnv*100):null,cpcM=tCl&&mailEff?Math.round(mailEff/tCl):null;
    html+='<div class="card" style="border-left:3px solid var(--gold)"><div class="ct" style="color:var(--gold)">MAILING</div>'
      +'<div class="kpi-grid">'
      +'<div class="kpi gold"><div class="kl">Enviados</div><div class="kv">'+tEnv.toLocaleString()+'</div><div class="ks">'+mailCamps.length+' campañas</div></div>'
      +'<div class="kpi '+(avgAp?'green':'neutral')+'"><div class="kl">Apertura prom.</div><div class="kv">'+(avgAp?avgAp+'%':'—')+'</div></div>'
      +'<div class="kpi '+(gCTR?'green':'neutral')+'"><div class="kl">CTR promedio</div><div class="kv">'+(gCTR?gCTR+'%':'—')+'</div></div>'
      +'<div class="kpi '+(cpcM?'purple':'neutral')+'"><div class="kl">Costo/click</div><div class="kv">'+(cpcM?'$'+cpcM:'—')+'</div></div>'
      +'</div></div>';
  }

  el.innerHTML=html;
}

function renderOperativo(camps,el){
  var ATRASO_START='2026-05-01';
  var tracked=camps.filter(function(c){return c.fechaPlan&&c.fechaPlan>=ATRASO_START;});
  var conDev=tracked.filter(function(c){return c.fechaReal;});
  var atrasadas=conDev.filter(function(c){return desvio(c)>0;});
  var adelantadas=conDev.filter(function(c){return desvio(c)<0;});
  var sinReal=tracked.filter(function(c){return !c.fechaReal;});
  var totDev=0,totImp=0;
  atrasadas.forEach(function(c){var d=desvio(c);totDev+=d;if(c.budDia)totImp+=d*c.budDia;});
  var avgDev=atrasadas.length?Math.round(totDev/atrasadas.length*10)/10:0;
  var pctEj=tracked.length?Math.round(conDev.length/tracked.length*100):0;

  var byP={};
  tracked.forEach(function(c){var n=pName(c.producto);if(!byP[n])byP[n]={total:0,atr:0,imp:0};byP[n].total++;if(c.fechaReal&&desvio(c)>0){var d=desvio(c);byP[n].atr++;if(c.budDia)byP[n].imp+=d*c.budDia;}});

  var byMop={};
  tracked.forEach(function(c){var k=c.anio+'-'+String(c.mes).padStart(2,'0');if(!byMop[k])byMop[k]={label:MONTHS[c.mes].slice(0,3)+' '+String(c.anio).slice(2),total:0,atr:0};byMop[k].total++;if(c.fechaReal&&desvio(c)>0)byMop[k].atr++;});
  var mopKeys=Object.keys(byMop).sort().slice(-6);

  var html='';
  if(tracked.length===0){
    html='<div class="notice" style="border-left:3px solid var(--gold)">El seguimiento de atrasos aplica a campañas desde <strong>Mayo 2026</strong>. Las campañas históricas no se incluyen.</div>';
  }

  html+='<div class="kpi-grid">'
    +'<div class="kpi '+(tracked.length===0?'neutral':pctEj>=80?'green':pctEj>=50?'gold':'red')+'"><div class="kl">Seguimiento Mayo 26+</div><div class="kv">'+conDev.length+'/'+tracked.length+'</div><div class="ks">'+(tracked.length===0?'sin campañas aún':pctEj+'%')+'</div></div>'
    +'<div class="kpi '+(atrasadas.length===0?'green':atrasadas.length<3?'gold':'red')+'"><div class="kl">Con atraso</div><div class="kv">'+atrasadas.length+'</div><div class="ks">'+(adelantadas.length?adelantadas.length+' adelantadas':'')+'</div></div>'
    +'<div class="kpi '+(avgDev===0?'green':avgDev<=3?'gold':'red')+'"><div class="kl">Atraso promedio</div><div class="kv">'+(avgDev?avgDev+' días':'—')+'</div></div>'
    +'<div class="kpi '+(totImp===0?'green':totImp<500?'gold':'red')+'"><div class="kl">Impacto económico</div><div class="kv">'+(totImp?fmt(totImp):'$0')+'</div><div class="ks">no ejecutado a tiempo</div></div>'
    +(sinReal.length?'<div class="kpi neutral"><div class="kl">Sin fecha real</div><div class="kv">'+sinReal.length+'</div><div class="ks">pendientes</div></div>':'')
    +'</div>';

  html+='<div class="cg">';
  html+='<div class="cc"><div class="cct">Estado por producto</div>'
    +Object.entries(byP).map(function(e){
      var v=e[1],pctA=v.total?Math.round(v.atr/v.total*100):0;
      var sem=pctA===0?'var(--green)':pctA<30?'var(--gold)':'var(--red)';
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--brd)">'
        +'<span style="width:10px;height:10px;border-radius:50%;background:'+sem+';display:inline-block;flex-shrink:0"></span>'
        +'<span style="flex:1;font-size:12px">'+e[0]+'</span>'
        +'<span style="font-size:11px;color:'+sem+'">'+pctA+'% atrasos</span>'
        +(v.imp?'<span style="font-size:10px;color:var(--faint)">'+fmt(v.imp)+'</span>':'')
        +'</div>';
    }).join('')+'</div>';

  if(mopKeys.length>0){
    var maxA=Math.max.apply(null,mopKeys.map(function(k){return byMop[k].atr;}).concat([1]));
    html+='<div class="cc"><div class="cct">Tendencia de atrasos</div>'
      +mopKeys.map(function(k){
        var v=byMop[k],pct=Math.round(v.atr/maxA*100);
        return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:3px"><span>'+v.label+'</span><span>'+v.atr+' atrasos</span></div>'
          +'<div style="height:7px;background:var(--muted);border-radius:6px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+(v.atr===0?'var(--green)':v.atr<=2?'var(--gold)':'var(--red)')+';border-radius:6px"></div></div></div>';
      }).join('')+'</div>';
  }
  html+='</div>';

  if(atrasadas.length){
    html+='<div class="card"><div class="ct">Campañas con atraso</div><table class="dt"><thead><tr><th>Código</th><th>Producto</th><th>F. plan</th><th>F. real</th><th style="text-align:right">Días</th><th style="text-align:right">Impacto</th></tr></thead><tbody>'
      +atrasadas.sort(function(a,b){return desvio(b)-desvio(a);}).map(function(c){
        var d=desvio(c);
        return '<tr data-id="'+c.id+'" onclick="openDetail(this.dataset.id)">'
          +'<td style="font-size:11px">'+c.codigo+'</td><td>'+pName(c.producto)+'</td>'
          +'<td style="color:var(--dim)">'+fDate(c.fechaPlan)+'</td>'
          +'<td style="color:var(--red)">'+fDate(c.fechaReal)+'</td>'
          +'<td style="text-align:right;color:var(--red);font-weight:500">+'+d+'</td>'
          +'<td style="text-align:right">'+(c.budDia?fmt(d*c.budDia):'—')+'</td>'
          +'</tr>';
      }).join('')+'</tbody></table></div>';
  }

  if(sinReal.length){
    html+='<div class="card" style="border-left:3px solid var(--gold)"><div class="ct" style="color:var(--gold)">Pendientes sin fecha real</div>'
      +'<table class="dt"><thead><tr><th>Código</th><th>Producto</th><th>F. planificada</th><th>Tipo</th></tr></thead><tbody>'
      +sinReal.map(function(c){
        return '<tr data-id="'+c.id+'" onclick="openDetail(this.dataset.id)">'
          +'<td style="font-size:11px">'+c.codigo+'</td><td>'+pName(c.producto)+'</td>'
          +'<td style="color:var(--dim)">'+fDate(c.fechaPlan)+'</td><td>'+c.tipo+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }

  // ── VELOCIDAD DE CARGA DE DATOS ─────────────────────
  var withDates=camps.filter(function(c){return c.fechaReal&&c.fechaCarga&&c.effTotal;});
  if(withDates.length>=1){
    var totalDias2=0;
    withDates.forEach(function(c){
      var diff=Math.max(0,Math.round((new Date(c.fechaCarga)-new Date(c.fechaReal+'T00:00:00'))/86400000));
      totalDias2+=diff;
    });
    var avgDias2=Math.round(totalDias2/withDates.length);
    html+='<div class="card"><div class="ct">Velocidad de carga de datos</div>'
      +'<div class="kpi-grid">'
      +'<div class="kpi '+(avgDias2<=3?'green':avgDias2<=7?'gold':'red')+'">'
      +'<div class="kl">Demora promedio</div><div class="kv">'+avgDias2+' días</div>'
      +'<div class="ks">entre fecha real y carga en sistema</div></div>'
      +'<div class="kpi neutral"><div class="kl">Campañas con datos</div><div class="kv">'+withDates.length+'</div>'
      +'<div class="ks">de '+camps.length+' totales</div></div>'
      +'</div>'
      +'<table class="dt" style="margin-top:12px"><thead><tr>'
      +'<th>Código</th><th>Fecha real</th><th>Fecha carga</th><th style="text-align:right">Demora</th>'
      +'</tr></thead><tbody>'
      +withDates.sort(function(a,b){
        return Math.round((new Date(b.fechaCarga)-new Date(b.fechaReal+'T00:00:00'))/86400000)
          -Math.round((new Date(a.fechaCarga)-new Date(a.fechaReal+'T00:00:00'))/86400000);
      }).slice(0,8).map(function(c){
        var dias=Math.max(0,Math.round((new Date(c.fechaCarga)-new Date(c.fechaReal+'T00:00:00'))/86400000));
        return '<tr><td style="font-size:11px">'+c.codigo+'</td>'
          +'<td style="color:var(--dim);font-size:11px">'+fDate(c.fechaReal)+'</td>'
          +'<td style="color:var(--dim);font-size:11px">'+fDate(c.fechaCarga)+'</td>'
          +'<td style="text-align:right;color:'+(dias<=3?'var(--green)':dias<=7?'var(--gold)':'var(--red)')+'">'+dias+' días</td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }

  // Cancelled campaigns section
  var canceladas=camps.filter(function(c){return c.cancelada;});
  if(canceladas.length){
    var byCategoria={};
    canceladas.forEach(function(c){
      var cat=c.cancelCategoria||'Sin categoría';
      if(!byCategoria[cat])byCategoria[cat]=[];
      byCategoria[cat].push(c);
    });

    html+='<div class="card" style="border-left:3px solid var(--red)"><div class="ct" style="color:var(--red)">Campañas canceladas · '+canceladas.length+'</div>';

    // Summary by category
    html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">';
    var catColors={'Operativa':'var(--red)','Presupuesto':'var(--gold)','Estrategia':'var(--blue)','Fuerza mayor':'var(--dim)'};
    Object.entries(byCategoria).forEach(function(e){
      var col=catColors[e[0]]||'var(--dim)';
      html+='<div style="padding:8px 14px;border-radius:var(--r);background:var(--muted);border:1px solid var(--brd)">'
        +'<div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:'+col+';margin-bottom:4px">'+e[0]+'</div>'
        +'<div style="font-family:var(--serif);font-size:22px">'+e[1].length+'</div>'
        +'</div>';
    });
    html+='</div>';

    html+='<table class="dt"><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Fecha cancel.</th><th>Detalle</th><th style="text-align:right">Pres.</th></tr></thead><tbody>'
      +canceladas.map(function(c){
        var col=catColors[c.cancelCategoria]||'var(--dim)';
        return '<tr data-id="'+c.id+'" onclick="openDetail(this.dataset.id)">'
          +'<td style="font-size:11px">'+c.codigo+'</td>'
          +'<td>'+pName(c.producto)+'</td>'
          +'<td><span style="font-size:10px;font-weight:500;color:'+col+'">'+(c.cancelCategoria||'—')+'</span></td>'
          +'<td style="color:var(--dim);font-size:11px">'+fDate(c.fechaCancelacion)+'</td>'
          +'<td style="font-size:11px;color:var(--dim);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(c.motivoCancelacion||'—')+'</td>'
          +'<td style="text-align:right">'+(c.budTotal?fmt(c.budTotal):'—')+'</td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }

  el.innerHTML=html;
}

// ── EXCEL ────────────────────────────────────────────
function exportExcel(){
  var camps=getDashCamps();
  if(!camps.length){alert('No hay campañas para exportar.');return;}

  // Main sheet: campaigns
  var rows=[['Código','Fecha','Producto','Área','Tipo','Modo','F. Planificada','F. Real','Desvío (días)',
    'Pres. Diario','Pres. Días','Pres. Total','Efec. Diario','Efec. Días','Efec. Total',
    'Leads','WPP','CPL','CPC WPP','Eficiencia %','Score',
    'Leads ALTA','Leads MEDIA','Leads BAJA','Tasa Calidad %','CPL ALTA',
    'Mail Proveedor Tipo','Mail Proveedor','Mail Enviados','Mail Apertura %','Mail Clicks',
    'Notas','Drive']];

  camps.forEach(function(c){
    var dev=desvio(c);
    var cplV=cpl(c),wppV=cpcW(c),effV=effPct(c),sc=campScore(c);
    var tasaCal=c.leadsAlta&&c.leads?Math.round(c.leadsAlta/c.leads*100):null;
    var cplAlta=c.leadsAlta&&c.effTotal?Math.round(c.effTotal/c.leadsAlta):null;
    rows.push([
      c.codigo, c.fecha, pName(c.producto), pArea(c.producto), c.tipo, c.modo||'',
      c.fechaPlan||'', c.fechaReal||'', dev!==null?dev:0,
      c.budDia||'', c.budDias||'', c.budTotal||'',
      c.effDia||'', c.effDias||'', c.effTotal||'',
      c.leads||'', c.wpp||'', cplV||'', wppV||'', effV||'', sc||'',
      c.leadsAlta||'', c.leadsMedia||'', c.leadsBaja||'', tasaCal||'', cplAlta||'',
      c.mailProvTipo||'', c.mailProv||'', c.mailEnviados||'', c.mailApertura||'', c.mailClicks||'',
      c.notas||'', c.media&&c.media.length?c.media[0].url:''
    ]);
  });

  // Summary by area
  var byArea={};
  camps.forEach(function(c){
    var a=pArea(c.producto)||'Otros';
    if(!byArea[a])byArea[a]={camps:0,bud:0,eff:0,leads:0,wpp:0,alta:0};
    byArea[a].camps++;
    if(c.budTotal)byArea[a].bud+=c.budTotal;
    if(c.effTotal)byArea[a].eff+=c.effTotal;
    if(c.leads)byArea[a].leads+=c.leads;
    if(c.wpp)byArea[a].wpp+=c.wpp;
    if(c.leadsAlta)byArea[a].alta+=c.leadsAlta;
  });
  var areaRows=[['Área','Campañas','Presupuesto','Efectivo','Leads','CPL','WPP','CPC WPP','Leads ALTA','Tasa Calidad %']];
  Object.entries(byArea).forEach(function(e){
    var v=e[1];
    var cplA=v.leads&&v.eff?Math.round(v.eff/v.leads):null;
    var wppA=v.wpp&&v.eff?Math.round(v.eff/v.wpp):null;
    var tasa=v.alta&&v.leads?Math.round(v.alta/v.leads*100):null;
    areaRows.push([e[0],v.camps,v.bud,v.eff,v.leads,cplA||'',v.wpp,wppA||'',v.alta,tasa||'']);
  });

  // Build workbook
  var wb=XLSX.utils.book_new();
  var ws1=XLSX.utils.aoa_to_sheet(rows);
  var ws2=XLSX.utils.aoa_to_sheet(areaRows);

  // Column widths
  ws1['!cols']=[{wch:30},{wch:12},{wch:18},{wch:12},{wch:8},{wch:12},{wch:12},{wch:12},{wch:10},
    {wch:12},{wch:10},{wch:12},{wch:12},{wch:10},{wch:12},
    {wch:8},{wch:8},{wch:8},{wch:10},{wch:12},{wch:8},
    {wch:12},{wch:12},{wch:12},{wch:14},{wch:10},
    {wch:14},{wch:16},{wch:14},{wch:14},{wch:12},{wch:30},{wch:40}];
  ws2['!cols']=[{wch:14},{wch:10},{wch:14},{wch:14},{wch:8},{wch:8},{wch:8},{wch:10},{wch:12},{wch:14}];

  XLSX.utils.book_append_sheet(wb,ws1,'Campañas');
  XLSX.utils.book_append_sheet(wb,ws2,'Por área');

  var fname='Campañas_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb,fname);
}

function exportPDF(){
  var camps=getDashCamps();
  var totB=0,totE=0,totL=0;
  camps.forEach(function(c){if(c.budTotal)totB+=c.budTotal;if(c.effTotal)totE+=c.effTotal;if(c.leads)totL+=c.leads;});
  var atrasadas=camps.filter(function(c){return c.fechaPlan&&c.fechaReal&&desvio(c)>0;});
  var totImp=0;atrasadas.forEach(function(c){var d=desvio(c);if(c.budDia)totImp+=d*c.budDia;});
  var style='<style>body{font-family:Georgia,serif;color:#0f0e0c;padding:32px;max-width:900px;margin:0 auto}h1{font-size:28px;font-style:italic;margin-bottom:4px}h2{font-size:16px;margin:24px 0 10px;border-bottom:1px solid #ddd;padding-bottom:4px}table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}th{padding:7px 10px;background:#f0ede6;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em}td{padding:7px 10px;border-bottom:1px solid #ede9e1}.krow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}.kb{border:1px solid #ddd;border-radius:8px;padding:12px 16px;min-width:120px}.kl{font-size:9px;text-transform:uppercase;color:#9a9286;margin-bottom:4px}.kv{font-size:22px;font-family:Georgia,serif}</style>';
  var body=pdfHeader()
    +'<h1>Reporte de Campañas</h1><p style="color:#9a9286;font-size:11px;margin-bottom:20px">'+camps.length+' campañas analizadas</p>'
    +'<h2>Financiero</h2><div class="krow">'
    +[['Total invertido','$'+totE.toLocaleString()],['Presupuestado','$'+totB.toLocaleString()],['Leads',totL],['CPL',totL&&totE?'$'+Math.round(totE/totL):'—']].map(function(k){return '<div class="kb"><div class="kl">'+k[0]+'</div><div class="kv">'+k[1]+'</div></div>';}).join('')
    +'</div><table><thead><tr><th>Código</th><th>Producto</th><th>Área</th><th>Tipo</th><th>Pres.</th><th>Efec.</th><th>CPL</th></tr></thead><tbody>'
    +camps.slice(0,30).map(function(c){return '<tr><td>'+c.codigo+'</td><td>'+(pName(c.producto)||'—')+'</td><td>'+(pArea(c.producto)||'—')+'</td><td>'+c.tipo+'</td><td>'+(c.budTotal?'$'+c.budTotal:'—')+'</td><td>'+(c.effTotal?'$'+c.effTotal:'—')+'</td><td>'+(cpl(c)?'$'+cpl(c):'—')+'</td></tr>';}).join('')
    +'</tbody></table>'
    +'<h2>Operativo</h2><div class="krow">'
    +[['Atrasos',atrasadas.length],['Impacto','$'+totImp.toLocaleString()]].map(function(k){return '<div class="kb"><div class="kl">'+k[0]+'</div><div class="kv">'+k[1]+'</div></div>';}).join('')
    +'</div>'+pdfFirma();
  var win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte</title>'+style+'</head><body>'+body+'</body></html>');
  win.document.close();setTimeout(function(){win.print();},500);
}

async function runAI(){
  var el=document.getElementById('ai-body');
  el.innerHTML='<p style="font-size:12px;color:var(--dim)">Analizando... ✦</p>';
  var camps=getDashCamps();
  var totB=0,totE=0,totL=0,totW=0;

  var summary=camps.slice(0,30).map(function(c){return {codigo:c.codigo,producto:pName(c.producto),area:pArea(c.producto),tipo:c.tipo,budTotal:c.budTotal,effTotal:c.effTotal,leads:c.leads,wpp:c.wpp,cplV:cpl(c),sc:campScore(c)};});
  var prompt='Analizá estos datos de campañas de marketing en español y respondé con: 1. Resumen ejecutivo 2. Qué está funcionando bien 3. Puntos de atención 4. Recomendaciones (máx 5) 5. Análisis operativo\n\nDatos: '+camps.length+' campañas, Presupuesto $'+totB+', Invertido $'+totE+', Leads '+totL+', WPP '+totW+'\nDetalle: '+JSON.stringify(summary);
  try{
    var resp=await fetch('https://mkt-ai-proxy.tcoppede.workers.dev/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    var data=await resp.json();
    var textBlock=data.content&&data.content.find?data.content.find(function(b){return b.type==='text'&&b.text;}):null;
    var text=textBlock?textBlock.text:(data.error?('Error API: '+(data.error.message||JSON.stringify(data.error))):'Sin respuesta de la IA. Probá de nuevo.');
    el.innerHTML=text.split('\n\n').filter(function(s){return s.trim();}).map(function(s){
      var nl=s.indexOf('\n');var title=nl>-1?s.slice(0,nl):s;var body=nl>-1?s.slice(nl+1).trim():'';
      return '<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--brd)">'
        +'<div style="font-size:12px;font-weight:500;margin-bottom:6px">'+title+'</div>'
        +(body?'<div style="font-size:12px;color:var(--dim);line-height:1.7">'+body.split('\n').join('<br>')+'</div>':'')
        +'</div>';
    }).join('');
  }catch(e){el.innerHTML='<p style="font-size:12px;color:var(--red)">Error al conectar con IA: '+e.message+'</p>';console.error(e);}

// ── IMPORT FROM CALENDAR ─────────────────────────────
function openImport(){document.getElementById('mod-import').classList.add('on');document.getElementById('import-body').innerHTML='<p style="font-size:12px;color:var(--dim)">Cargando...</p>';loadCalData();}
function closeImport(){document.getElementById('mod-import').classList.remove('on');}
document.getElementById('mod-import').onclick=function(e){if(e.target===e.currentTarget)closeImport();};

async function loadCalData(){
  try{
    var r=await fetch('https://api.jsonbin.io/v3/b/'+CAL_BIN+'/latest',{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok)throw new Error(r.status);
    renderImport((await r.json()).record);
  }catch(e){document.getElementById('import-body').innerHTML='<p style="font-size:12px;color:var(--red)">Error al leer el calendario.</p>';}
}

function renderImport(calData){
  var calendars=calData.calendars||{};
  var calProds=calData.products||[];
  var calCamps=calData.campaigns||[];
  var grouped={};
  Object.keys(calendars).forEach(function(k){
    var parts=k.split('-').map(Number),year=parts[0],month=parts[1];
    var cells=calendars[k].cells||{};
    Object.keys(cells).forEach(function(ck){
      var cp=ck.split('-'),d=parseInt(cp[2]),pid=cp.slice(3).join('-');
      var cid=cells[ck];
      var calCamp=calCamps.find?calCamps.find(function(c){return c.id===cid;}):null;
      var calProd=calProds.find?calProds.find(function(p){return p.id===pid;}):null;
      if(!d||!pid||!calCamp)return;
      var localProd=G.products.find(function(p){return calProd&&p.name===calProd.name;});
      var localTipo=G.tipos.find(function(t){return calCamp&&t.name===calCamp.name;})||G.tipos[0];
      var gkey=year+'-'+month+'-'+(localProd?localProd.id:pid)+'-'+(localTipo?localTipo.name:'');
      if(!grouped[gkey])grouped[gkey]={year:year,month:month,productId:localProd?localProd.id:'',productName:calProd?calProd.name:pid,productArea:calProd?calProd.area:'',tipoName:localTipo?localTipo.name:'',budDia:calCamp?calCamp.budget:null,days:[]};
      grouped[gkey].days.push(d);
    });
  });
  if(!Object.keys(grouped).length){document.getElementById('import-body').innerHTML='<p style="font-size:12px;color:var(--dim)">No hay datos para importar.</p>';return;}
  var entries=Object.entries(grouped).map(function(e){
    var g=e[1];g.days.sort(function(a,b){return a-b;});
    var fd=g.days[0];
    var iso=g.year+'-'+String(g.month+1).padStart(2,'0')+'-'+String(fd).padStart(2,'0');
    return {key:e[0],year:g.year,month:g.month,productId:g.productId,productName:g.productName,productArea:g.productArea,tipoName:g.tipoName,budDia:g.budDia,diasCount:g.days.length,budTotal:g.budDia?g.budDia*g.days.length:null,isoDate:iso};
  });
  var existingCodes=new Set(G.campaigns.map(function(c){return c.codigo;}));
  var html='<div class="notice">Una campaña por producto + tipo por mes. Trae fecha, días y presupuesto del calendario.</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn btn-sm" onclick="document.querySelectorAll(\'.imp-cb:not(:disabled)\').forEach(function(c){c.checked=true;})">Todo</button><button class="btn btn-sm" onclick="document.querySelectorAll(\'.imp-cb\').forEach(function(c){c.checked=false;})">Ninguno</button></div>';
  var byMonth={};
  entries.forEach(function(e){var mk=e.year+'-'+String(e.month).padStart(2,'0');if(!byMonth[mk])byMonth[mk]={label:MONTHS[e.month]+' '+e.year,entries:[]};byMonth[mk].entries.push(e);});
  Object.keys(byMonth).sort().reverse().forEach(function(mk){
    var m=byMonth[mk];
    html+='<div style="margin-bottom:16px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--brd)">'+m.label+'</div>';
    m.entries.forEach(function(e){
      var code=genCode(e.productId,e.tipoName,e.isoDate);
      var exists=existingCodes.has(code);
      var col=tColor(e.tipoName);
      html+='<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);margin-bottom:5px;border:1px solid var(--brd);background:'+(exists?'var(--muted)':'var(--surf)')+';cursor:'+(exists?'default':'pointer')+';opacity:'+(exists?.5:1)+'">'
        +'<input type="checkbox" class="imp-cb" data-e="'+encodeURIComponent(JSON.stringify(e))+'"'+(exists?' disabled':'')+' style="width:14px;height:14px;accent-color:var(--ink);flex-shrink:0">'
        +'<div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:3px"><strong style="font-size:12px">'+e.productName+'</strong><span style="font-size:10px;color:var(--faint)">'+e.productArea+'</span><span style="display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:500;background:'+rgba(col,.1)+';color:'+col+';border:1px solid '+rgba(col,.25)+'">'+e.tipoName+'</span>'+(exists?'<span style="font-size:10px;color:var(--faint)">ya existe</span>':'')+'</div>'
        +'<div style="font-size:10px;color:var(--dim)">Inicio: '+fDate(e.isoDate)+' · '+e.diasCount+' días'+(e.budDia?' · $'+e.budDia+'/día':'')+(e.budTotal?' · Total $'+e.budTotal:'')+'</div></div></label>';
    });
    html+='</div>';
  });
  html+='<div style="display:flex;gap:8px;margin-top:4px"><button class="btn btn-ink" onclick="doImport()">Importar →</button><button class="btn" onclick="closeImport()">Cancelar</button></div>';
  document.getElementById('import-body').innerHTML=html;
}

function doImport(){
  var checked=document.querySelectorAll('.imp-cb:checked');
  if(!checked.length){alert('Seleccioná al menos una.');return;}
  var imported=0;
  checked.forEach(function(cb){
    var e=JSON.parse(decodeURIComponent(cb.dataset.e));
    var code=genCode(e.productId,e.tipoName,e.isoDate);
    if(!G.campaigns.find(function(c){return c.codigo===code;})){
      var d=new Date(e.isoDate+'T00:00:00');
      G.campaigns.unshift({id:'c'+Date.now()+imported,fechaCarga:new Date().toISOString().slice(0,10),fecha:e.isoDate,mes:d.getMonth(),anio:d.getFullYear(),producto:e.productId,tipo:e.tipoName,modo:'',codigo:code,fechaPlan:e.isoDate,fechaReal:'',budDia:e.budDia||null,budDias:e.diasCount||null,budTotal:e.budTotal||null,effDia:null,effDias:null,effTotal:null,leads:null,wpp:null,mailProvTipo:'',mailProv:'',mailEnviados:null,mailApertura:null,mailClicks:null,notas:'Importado del calendario',media:[],updatedAt:new Date().toISOString()});
      imported++;
    }
  });
  logActivity('calendar_import','Importó '+imported+' campañas desde el calendario');
  syncSave();closeImport();renderLista();
  alert(imported+' campaña'+(imported!==1?'s':'')+' importada'+(imported!==1?'s':'')+'. Completá los datos pendientes.');
}

// ── JSON IMPORT ──────────────────────────────────────
function doJSONImport(){
  var text=document.getElementById('json-import-text').value.trim();
  var res=document.getElementById('import-result');
  if(!text){res.textContent='Pegá el contenido del JSON primero.';return;}
  try{
    var data=JSON.parse(text);
    var incoming=data.campaigns||[];
    if(!incoming.length){res.textContent='El archivo no tiene campañas.';return;}
    var existingIds=new Set(G.campaigns.map(function(c){return c.id;}));
    var added=0,skipped=0;
    incoming.forEach(function(c){if(existingIds.has(c.id))skipped++;else{G.campaigns.push(c);added++;}});
    logActivity('json_import','Importó '+added+' campañas desde JSON');
    syncSave();
    res.innerHTML='<span style="color:var(--green)">✓ '+added+' importadas.</span>'+(skipped?' '+skipped+' ya existían.':'');
    setTimeout(function(){goTo('lista');},1500);
  }catch(err){res.textContent='Error: '+err.message;}
}

function calcMailMetrics(){
  var env=parseFloat(document.getElementById('mf-env').value)||0;
  var ap=parseFloat(document.getElementById('mf-ap').value)||0;
  var cl=parseFloat(document.getElementById('mf-cl').value)||0;
  var apH=document.getElementById('mf-ap-pct');
  var clH=document.getElementById('mf-cl-pct');
  if(apH)apH.textContent=env&&ap?Math.round(ap/env*100)+'% apertura':'';
  if(clH)clH.textContent=env&&cl?Math.round(cl/env*100)+'% CTR':'';
}

function submitMailing(){
  var fecha=document.getElementById('mf-fecha').value;
  var nombre=document.getElementById('mf-nombre').value.trim();
  if(!fecha||!nombre){alert('Completá Fecha y Nombre.');return;}
  var d=new Date(fecha+'T00:00:00');
  var mail={
    id:editMailId||('m'+Date.now()),
    fecha:fecha,mes:d.getMonth(),anio:d.getFullYear(),
    nombre:nombre,
    producto:document.getElementById('mf-producto').value,
    provTipo:document.getElementById('mf-prov-tipo').value,
    prov:document.getElementById('mf-prov').value,
    costo:parseFloat(document.getElementById('mf-costo').value)||null,
    enviados:parseFloat(document.getElementById('mf-env').value)||null,
    aperturas:parseFloat(document.getElementById('mf-ap').value)||null,
    clicks:parseFloat(document.getElementById('mf-cl').value)||null,
    leads:parseFloat(document.getElementById('mf-leads').value)||null,
    base:document.getElementById('mf-base').value,
    notas:document.getElementById('mf-notas').value,
    updatedAt:new Date().toISOString()
  };
  if(editMailId){var idx=G.mailings.findIndex(function(x){return x.id===editMailId;});if(idx>=0)G.mailings[idx]=mail;}
  else G.mailings.unshift(mail);
  editMailId=null;
  syncSave();closeMForm();renderMailings();
}

function deleteMailing(){
  if(!editMailId||!confirm('¿Eliminar este mailing?'))return;
  G.mailings=G.mailings.filter(function(m){return m.id!==editMailId;});
  editMailId=null;syncSave();closeMForm();renderMailings();
}

function submitVenta(){
  var fecha=document.getElementById('vf-fecha').value;
  var cliente=document.getElementById('vf-cliente').value.trim();
  var monto=parseFloat(document.getElementById('vf-monto').value)||null;
  if(!fecha||!cliente){alert('Completá Fecha y Cliente.');return;}
  var d=new Date(fecha+'T00:00:00');
  var venta={
    id:editVentaId||('v'+Date.now()),
    fecha:fecha,mes:d.getMonth(),anio:d.getFullYear(),
    cliente:cliente,
    producto:document.getElementById('vf-producto').value,
    tipoVenta:document.getElementById('vf-tipo').value,
    monto:monto,
    campanaId:document.getElementById('vf-campana').value,
    notas:document.getElementById('vf-notas').value,
    updatedAt:new Date().toISOString()
  };
  if(editVentaId){var idx=G.ventas.findIndex(function(x){return x.id===editVentaId;});if(idx>=0)G.ventas[idx]=venta;}
  else G.ventas.unshift(venta);
  editVentaId=null;
  syncSave();closeVForm();renderVentas();
}

function deleteVenta(){
  if(!editVentaId||!confirm('¿Eliminar esta venta?'))return;
  G.ventas=G.ventas.filter(function(v){return v.id!==editVentaId;});
  editVentaId=null;syncSave();closeVForm();renderVentas();
}

function renderVentas(){
  var el=document.getElementById('ventas-content');if(!el)return;
  var vs=G.ventas;

  if(!vs.length){
    el.innerHTML='<div class="empty"><p>No hay ventas registradas.</p><button class="btn btn-ink" onclick="newVenta()" style="margin-top:12px">+ Nueva venta</button></div>';
    return;
  }

  // KPIs
  var totMonto=0,totNuevo=0,totRec=0;
  var byProd={},byCamp={};
  vs.forEach(function(v){
    if(v.monto)totMonto+=v.monto;
    if(v.tipoVenta==='Nuevo')totNuevo++;
    if(v.tipoVenta==='Recurrente')totRec++;
    var pn=pName(v.producto)||'—';
    if(!byProd[pn])byProd[pn]={count:0,monto:0};
    byProd[pn].count++;if(v.monto)byProd[pn].monto+=v.monto;
    if(v.campanaId){
      if(!byCamp[v.campanaId])byCamp[v.campanaId]={count:0,monto:0};
      byCamp[v.campanaId].count++;if(v.monto)byCamp[v.campanaId].monto+=v.monto;
    }
  });

  // ROI: total facturado vs total invertido en campañas vinculadas
  var totalInvCamps=0;
  Object.keys(byCamp).forEach(function(cid){
    var c=G.campaigns.find(function(x){return x.id===cid;});
    if(c&&c.effTotal)totalInvCamps+=c.effTotal;
  });
  var roi=totalInvCamps?Math.round((totMonto-totalInvCamps)/totalInvCamps*100):null;

  var html='<div class="kpi-grid">'
    +'<div class="kpi green"><div class="kl">Total facturado</div><div class="kv">$'+totMonto.toLocaleString()+'</div><div class="ks">'+vs.length+' ventas</div></div>'
    +'<div class="kpi blue"><div class="kl">Inversión vinculada</div><div class="kv">'+(totalInvCamps?'$'+totalInvCamps.toLocaleString():'—')+'</div><div class="ks">campañas de origen</div></div>'
    +'<div class="kpi '+(roi!==null?roi>=0?'green':'red':'neutral')+'"><div class="kl">ROI</div><div class="kv">'+(roi!==null?(roi>0?'+':'')+roi+'%':'—')+'</div><div class="ks">'+(roi!==null?roi>=0?'rentable':'negativo':'sin datos')+'</div></div>'
    +'<div class="kpi gold"><div class="kl">Nuevos clientes</div><div class="kv">'+totNuevo+'</div></div>'
    +'<div class="kpi neutral"><div class="kl">Recurrentes</div><div class="kv">'+totRec+'</div></div>'
    +'<div class="kpi neutral"><div class="kl">Ticket promedio</div><div class="kv">'+(vs.length?'$'+Math.round(totMonto/vs.length).toLocaleString():'—')+'</div></div>'
    +'</div>';

  // By product
  if(Object.keys(byProd).length>1){
    var maxP=Math.max.apply(null,Object.values(byProd).map(function(v){return v.monto;}));
    html+='<div class="cg"><div class="cc"><div class="cct">Facturación por producto</div>'
      +Object.entries(byProd).sort(function(a,b){return b[1].monto-a[1].monto;}).map(function(e){
        var pct=maxP>0?Math.round(e[1].monto/maxP*100):0;
        return '<div class="br"><div class="bl">'+e[0]+'</div><div class="bt"><div class="bf" style="width:'+pct+'%;background:var(--green)"></div></div><div class="bv">$'+e[1].monto.toLocaleString()+'<br><span style="font-size:9px;color:var(--faint)">'+e[1].count+' ventas</span></div></div>';
      }).join('')+'</div>';

    // Top campaigns by revenue
    var campRev=Object.entries(byCamp).map(function(e){
      var c=G.campaigns.find(function(x){return x.id===e[0];});
      var inv=c&&c.effTotal?c.effTotal:0;
      var roiC=inv?Math.round((e[1].monto-inv)/inv*100):null;
      return {cod:c?c.codigo:e[0],monto:e[1].monto,count:e[1].count,inv:inv,roi:roiC};
    }).sort(function(a,b){return b.monto-a.monto;});

    html+='<div class="cc"><div class="cct">Facturación por campaña</div>'
      +campRev.slice(0,6).map(function(r){
        var pct=campRev[0].monto>0?Math.round(r.monto/campRev[0].monto*100):0;
        return '<div class="br"><div class="bl" style="max-width:120px">'+r.cod+'</div><div class="bt"><div class="bf" style="width:'+pct+'%;background:var(--blue)"></div></div>'
          +'<div class="bv">$'+r.monto.toLocaleString()+'<br><span style="font-size:9px;color:'+(r.roi!==null?r.roi>=0?'var(--green)':'var(--red)':'var(--faint)')+';">'+(r.roi!==null?'ROI '+(r.roi>0?'+':'')+r.roi+'%':'—')+'</span></div></div>';
      }).join('')+'</div></div>';
  }

  // Table
  html+='<div class="tw"><div style="overflow-x:auto"><table class="dt"><thead><tr>'
    +'<th>Fecha</th><th>Cliente</th><th>Producto</th><th>Tipo</th>'
    +'<th style="text-align:right">Facturación</th><th>Campaña origen</th><th></th>'
    +'</tr></thead><tbody>'
    +vs.map(function(v){
      var camp=v.campanaId?G.campaigns.find(function(c){return c.id===v.campanaId;}):null;
      return '<tr>'
        +'<td style="color:var(--dim);font-size:11px">'+fDate(v.fecha)+'</td>'
        +'<td><strong style="font-size:12px">'+v.cliente+'</strong></td>'
        +'<td style="font-size:11px">'+(pName(v.producto)||'—')+'</td>'
        +'<td style="font-size:11px">'+(v.tipoVenta?'<span style="padding:1px 7px;border-radius:20px;font-size:10px;background:'+(v.tipoVenta==='Nuevo'?'var(--bbg)':'var(--muted)')+';color:'+(v.tipoVenta==='Nuevo'?'var(--blue)':'var(--dim)')+'">'+v.tipoVenta+'</span>':'—')+'</td>'
        +'<td style="text-align:right;font-weight:500;color:var(--green)">'+(v.monto?'$'+v.monto.toLocaleString():'—')+'</td>'
        +'<td style="font-size:11px;color:var(--dim)">'+(camp?camp.codigo:'—')+'</td>'
        +'<td onclick="event.stopPropagation()"><button class="btn btn-xs" data-vid="'+v.id+'" onclick="editVenta(this.dataset.vid)">✎</button></td>'
        +'</tr>';
    }).join('')
    +'</tbody></table></div></div>';

  el.innerHTML=html;
}

function exportVentasExcel(){
  if(!G.ventas.length){alert('No hay ventas para exportar.');return;}

  var rows=[['Fecha','Cliente','Producto','Área','Tipo de venta','Facturación ($)',
    'Campaña origen','Tipo campaña','Presupuesto campaña','Invertido campaña',
    'ROI (%)','Notas']];

  G.ventas.forEach(function(v){
    var camp=v.campanaId?G.campaigns.find(function(c){return c.id===v.campanaId;}):null;
    var inv=camp&&camp.effTotal?camp.effTotal:null;
    var roi=inv&&v.monto?Math.round((v.monto-inv)/inv*100):null;
    rows.push([
      v.fecha,
      v.cliente,
      pName(v.producto)||'—',
      pArea(v.producto)||'—',
      v.tipoVenta||'—',
      v.monto||0,
      camp?camp.codigo:'—',
      camp?camp.tipo:'—',
      camp?camp.budTotal||'':'—',
      inv||'—',
      roi!==null?roi+'%':'—',
      v.notas||''
    ]);
  });

  // Summary by product
  var byProd={};
  G.ventas.forEach(function(v){
    var pn=pName(v.producto)||'—';
    var a=pArea(v.producto)||'—';
    if(!byProd[pn])byProd[pn]={area:a,count:0,monto:0,inv:0};
    byProd[pn].count++;
    if(v.monto)byProd[pn].monto+=v.monto;
    if(v.campanaId){var c=G.campaigns.find(function(x){return x.id===v.campanaId;});if(c&&c.effTotal)byProd[pn].inv+=c.effTotal;}
  });

  var sumRows=[['Producto','Área','Ventas','Facturación total','Inversión vinculada','ROI (%)']];
  Object.entries(byProd).forEach(function(e){
    var v=e[1];
    var roi=v.inv&&v.monto?Math.round((v.monto-v.inv)/v.inv*100):null;
    sumRows.push([e[0],v.area,v.count,v.monto,v.inv||'—',roi!==null?roi+'%':'—']);
  });

  var wb=XLSX.utils.book_new();
  var ws1=XLSX.utils.aoa_to_sheet(rows);
  var ws2=XLSX.utils.aoa_to_sheet(sumRows);
  ws1['!cols']=[{wch:12},{wch:20},{wch:16},{wch:12},{wch:14},{wch:14},{wch:30},{wch:10},{wch:14},{wch:14},{wch:10},{wch:30}];
  ws2['!cols']=[{wch:16},{wch:12},{wch:8},{wch:16},{wch:18},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws1,'Ventas');
  XLSX.utils.book_append_sheet(wb,ws2,'Por producto');
  XLSX.writeFile(wb,'Ventas_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ── LOGGING ──────────────────────────────────────────
async function logActivity(action,detail){
  try{
    var r=await fetch('https://api.jsonbin.io/v3/b/'+BIN_ID+'/latest',{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok)return;
    var rec=(await r.json()).record||{};
    var logs=rec.logs||[];
    logs.push({ts:new Date().toISOString(),role:userRole||'—',user:userName||'—',page:'campanas',action:action,detail:detail||''});
    if(logs.length>300)logs=logs.slice(logs.length-300);
    rec.logs=logs;
    await fetch('https://api.jsonbin.io/v3/b/'+BIN_ID,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(rec)});
  }catch(e){console.error('log error',e);}
}

  {name:'Victoria Scarpettini',hash:'e39e82d0c063a44d845d1d3a6c610f2cf2d8f583b37de02e34e143adca8f585b',role:'mkt'},
  {name:'Valentina Maroño Ferrer',hash:'b3fd42514ae4733d141b3e767b78fde0e3828f483788460ff85fc5a441ba98cf',role:'mkt'},
  {name:'Administrador (Tomás Coppede)',hash:'63d0504d1132b7cbff51d6253504430ba72f85ec2f2e2ab2fa1169f102f30d48',role:'admin'},
  {name:'Visita',hash:'fb113b4df80f8277df97fdbd31ebdbafea1847ae010c54d31db9da40a2964b04',role:'visitor'}
];
var userRole=null;
var userName=null;

function sha256(str){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
    .then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
}

function doLogin(){
  var pwd=document.getElementById('login-pwd').value;
  sha256(pwd).then(function(hash){
    var profile=PROFILES.find(function(p){return p.hash===hash;});
    if(profile){
      userRole=profile.role;
      userName=profile.name;
      startApp();
    }else{
      document.getElementById('login-err').textContent='Contraseña incorrecta';
      document.getElementById('login-pwd').value='';
    }
  });
}

function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  logActivity('login','Inicio de sesión en Campañas ('+(userName||userRole)+')');
  if(userRole==='visitor'){
    document.getElementById('ro-badge').style.display='block';
    disableForVisitor();
  }
  renderAll();
  renderForm();
  syncLoad();
}
